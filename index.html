    var ua = navigator.userAgent || '';
    return /iPhone|iPod/.test(ua) ||
           (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  }
  function fmtDate(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d)) return '-';
    return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  }
  function daysTo(iso) {
    if (!iso) return null;
    var t = new Date(iso + 'T00:00:00'), n = new Date();
    n.setHours(0, 0, 0, 0);
    if (isNaN(t)) return null;
    return Math.round((t - n) / 86400000);
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function sname(k) { return SUBJ[k] ? SUBJ[k].short : k; }
  function roundLabel(r) {
    var y = DATA.meta.roundYears[r];
    return r + RLABEL + (y ? '(' + y + ')' : '');
  }
  function modeOf(q) { return q.mode || MODE; }

  var toastT;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.classList.remove('on'); }, 2200);
  }

  /* --------------------------------------------------- 주제 통계 (빈출등급) */

  var TOPICS = (function () {
    var m = {};
    QS.forEach(function (q) {
      var key = q.subject + '|' + q.cat2;
      if (!m[key]) m[key] = { subject: q.subject, cat1: q.cat1, cat2: q.cat2, total: 0, recent: 0, ids: [] };
      m[key].total++;
      m[key].ids.push(q.id);
      if (q.round >= RECENT_FROM) m[key].recent++;
    });
    Object.keys(m).forEach(function (k) {
      var t = m[k];
      t.grade = t.total >= THRESH.A ? 'A' : (t.total >= THRESH.B ? 'B' : 'C');
      // 총 출제는 많은데 최근 5년 출제가 뜸한 주제 = 재출제 유력
      t.due = t.total >= 4 && t.recent <= 1;
    });
    return m;
  })();
  function topicOf(q) { return TOPICS[q.subject + '|' + q.cat2]; }

  /* 숙달도 — 회독 단계를 가중해서 센다.
     암기완료(4회독) 개수만 세면 한 바퀴를 다 돌아도 0%로 보여 진척이 멈춘 것처럼 읽힌다. */
  function masteryOf(ids) {
    var done = 0, sum = 0;
    ids.forEach(function (id) {
      var p = progOf(id);
      var st = p ? (p.st || 0) : 0;
      sum += st;
      if (st >= TOP) done++;
    });
    return { done: done, total: ids.length, sum: sum, pc: pct(sum, ids.length * TOP) };
  }
  function topicMastery(t) { return masteryOf(t.ids); }

  /* ------------------------------------------------------------ 채점 엔진 */

  var ROMAN = { 'Ⅰ': '1', 'Ⅱ': '2', 'Ⅲ': '3', 'Ⅳ': '4', 'Ⅴ': '5', 'Ⅵ': '6' };

  function norm(s) {
    return String(s == null ? '' : s)
      .replace(/[ⅠⅡⅢⅣⅤⅥ]/g, function (m) { return ROMAN[m]; })
      .toLowerCase()
      .replace(/[^0-9a-z가-힣]/g, '');
  }

  var ALIAS_CACHE = {};
  function aliases(kw) {
    if (ALIAS_CACHE[kw]) return ALIAS_CACHE[kw];
    var set = {};
    function add(v) { var n = norm(v); if (n.length >= 2) set[n] = 1; }
    add(kw);
    // 괄호 분리 — 피로골절(fatigue fracture) → 피로골절 / fatiguefracture
    var m = kw.match(/^([^（(]*)[（(]([^）)]*)[）)](.*)$/);
    if (m) { add(m[1] + m[3]); add(m[2]); }
    // 중점·슬래시 결합어 분해
    kw.split(/[·・/,]/).forEach(function (p) { if (p.trim().length > 1) add(p); });
    // 로마숫자 ↔ 라틴 표기 변형 (대인배상Ⅰ / 대인배상1 / 대인배상I)
    Object.keys(set).forEach(function (n) {
      if (/[1-6]/.test(n)) {
        set[n.replace(/1/g, 'i').replace(/2/g, 'ii').replace(/3/g, 'iii')] = 1;
      }
    });
    var out = Object.keys(set);
    ALIAS_CACHE[kw] = out;
    return out;
  }

  /* 객관식 정답 인덱스. 엑셀의 '정답' 칸은 번호(3)로도, 보기 원문으로도,
     ③ 같은 원문자로도 들어오기 때문에 셋 다 받아준다. */
  var CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩';
  function answerIndex(q) {
    var ch = q.choices || [], a = (q.answer || '').trim();
    if (!a) return -1;
    var ci = CIRCLED.indexOf(a.charAt(0));
    if (ci >= 0 && ci < ch.length) return ci;
    var n = parseInt(a, 10);
    if (!isNaN(n) && n >= 1 && n <= ch.length) return n - 1;
    var exact = ch.indexOf(a);
    if (exact >= 0) return exact;
    for (var i = 0; i < ch.length; i++) {
      if (norm(ch[i]) && norm(ch[i]) === norm(a)) return i;
    }
    return -1;
  }

  function gradeChoice(q, pick) {
    var ai = answerIndex(q);
    return { pick: pick, correctIdx: ai, correct: ai >= 0 && pick === ai, tot: 1,
             hit: (ai >= 0 && pick === ai) ? 1 : 0 };
  }

  /* 단답형은 정확 일치다. 앞뒤 공백과 연속 공백만 정리하고 그 이상은 손대지 않는다.
     가운뎃점이나 괄호까지 무시하기 시작하면 서로 다른 답이 같아진다. */
  function tidy(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' '); }

  /* '모두 고르시오' 형 정답은 기호의 집합이다. 순서도 구분자도 따지지 않는다 —
     실제 시험이 그렇고, 'ㄹ, ㅁ' 만 정답으로 두면 'ㅁ, ㄹ' 이 오답이 된다. */
  var SET_TOKENS = '㉠㉡㉢㉣㉤㉥①②③④⑤⑥⑦⑧⑨⑩ㄱㄴㄷㄹㅁㅂ';
  function tokenSet(s) {
    var out = {}, str = String(s == null ? '' : s);
    for (var i = 0; i < str.length; i++) {
      if (SET_TOKENS.indexOf(str.charAt(i)) >= 0) out[str.charAt(i)] = 1;
    }
    return out;
  }
  function sameSet(a, b) {
    var k;
    for (k in a) { if (!b[k]) return false; }
    for (k in b) { if (!a[k]) return false; }
    return true;
  }

  function blankOk(blank, typed) {
    if (blank.set && blank.set.length) {
      var want = {};
      for (var s = 0; s < blank.set.length; s++) want[blank.set[s]] = 1;
      return sameSet(tokenSet(typed), want);
    }
    var t = tidy(typed);
    if (!t) return false;
    if (t === tidy(blank.answer)) return true;
    var acc = blank.accepted || [];
    for (var i = 0; i < acc.length; i++) { if (t === tidy(acc[i])) return true; }
    return false;
  }

  /* 빈칸이 여러 개면 전부 맞아야 정답이다 — 실제 답안지와 같다.
     맞은 개수는 따로 돌려줘서 화면에 부분 정답을 보여줄 수 있게 한다. */
  function gradeShort(q, typedList) {
    var bl = q.blanks || [];
    var marks = bl.map(function (b, i) { return blankOk(b, (typedList || [])[i]); });
    var hit = marks.filter(Boolean).length;
    return { marks: marks, hit: hit, tot: bl.length, correct: bl.length > 0 && hit === bl.length };
  }

  function grade(q, answer) {
    var a = norm(answer);
    var hits = q.keywords.map(function (kw) {
      return { kw: kw, hit: a.length > 0 && aliases(kw).some(function (al) { return a.indexOf(al) >= 0; }) };
    });
    var n = hits.filter(function (x) { return x.hit; }).length;
    return { hits: hits, hit: n, tot: q.keywords.length };
  }

  /* ------------------------------------------------------------- 파생 통계 */

  function overall() {
    var wrong = 0, studied = 0, last = null;
    QS.forEach(function (q) {
      var p = progOf(q.id);
      if (!p) return;
      if (p.n > 0) studied++;
      if (isWrong(q.id)) wrong++;
      if (p.at && (!last || p.at > last)) last = p.at;
    });
    var m = masteryOf(QS.map(function (q) { return q.id; }));
    return { total: QS.length, done: m.done, pc: m.pc, wrong: wrong, studied: studied, last: last };
  }

  function subjStats(k) {
    var qs = QS.filter(function (q) { return q.subject === k; });
    var studied = 0, wrong = 0;
    qs.forEach(function (q) {
      var p = progOf(q.id);
      if (!p) return;
      if (p.n > 0) studied++;
      if (isWrong(q.id)) wrong++;
    });
    var m = masteryOf(qs.map(function (q) { return q.id; }));
    return { total: qs.length, done: m.done, studied: studied, wrong: wrong, pc: m.pc };
  }

  function isWrong(id) {
    var p = progOf(id);
    if (!p) return false;
    return p.bm === true || p.vd === 'vague' || p.vd === 'no';
  }
  function wrongIds() {
    return QS.filter(function (q) { return isWrong(q.id); }).map(function (q) { return q.id; });
  }

  /* 취약 주제 — 빈출등급이 높을수록, 숙달도가 낮을수록 우선 */
  function weakTopics(limit, subjectFilter) {
    var gw = { A: 3, B: 2, C: 1 };
    var list = Object.keys(TOPICS).map(function (k) { return TOPICS[k]; })
      .filter(function (t) { return !subjectFilter || t.subject === subjectFilter; })
      .map(function (t) {
        var m = topicMastery(t);
        return { t: t, m: m, risk: gw[t.grade] * (100 - m.pc) + (t.due ? 30 : 0) };
      })
      .filter(function (x) { return x.m.pc < 100; })
      .sort(function (a, b) { return b.risk - a.risk; });
    return limit ? list.slice(0, limit) : list;
  }

  /* --------------------------------------------------------- 합격 판정 --- */

  /* 이 시험들은 총점만 넘겨서는 붙지 않는다. 한 과목이라도 기준 미달이면 과락으로
     떨어지므로, 총점보다 과락 과목을 먼저 보여줘야 학습자가 어디를 손볼지 안다. */
  function judge(rec) {
    if (!PASSING) return null;
    var pts = PASSING.pointsPerQuestion || 1;
    var tRule = PASSING.totalRule || 0.6;
    var sRule = PASSING.subjectRule || 0.4;

    var rows = [];
    SKEYS.forEach(function (k) {
      var ids = rec.qids.filter(function (id) { return QMAP[id] && QMAP[id].subject === k; });
      if (!ids.length) return;
      var got = 0, answered = 0;
      ids.forEach(function (id) {
        var x = rec.res[id];
        if (!x) return;
        answered++;
        if (x.vd === 'ok') got += pts;
      });
      var full = ids.length * pts;
      rows.push({ key: k, name: sname(k), n: ids.length, answered: answered,
                  got: got, full: full, cut: Math.round(full * sRule),
                  fail: got < full * sRule, pc: pct(got, full) });
    });

    var got = rows.reduce(function (a, r) { return a + r.got; }, 0);
    var full = rows.reduce(function (a, r) { return a + r.full; }, 0);
    var answered = rows.reduce(function (a, r) { return a + r.answered; }, 0);
    var total = rows.reduce(function (a, r) { return a + r.n; }, 0);
    var failed = rows.filter(function (r) { return r.fail; });
    return {
      rows: rows, got: got, full: full, cut: Math.round(full * tRule),
      pc: pct(got, full), failed: failed,
      partial: answered < total, answered: answered, total: total,
      pass: got >= full * tRule && failed.length === 0
    };
  }

  /* ------------------------------------------------------------- 세션 관리 */

  function startSession(mode, label, qids) {
    if (!qids.length) { toast('조건에 맞는 문항이 없습니다'); return false; }
    S.cur = { id: uid(), mode: mode, label: label, qids: qids, i: 0, at: new Date().toISOString(), res: {} };
    save();
    go('#/study');
    return true;
  }

  function finishSession() {
    var c = S.cur;
    if (!c) return null;
    var wsum = 0, wgot = 0, excluded = 0, okN = 0, hitN = 0, totN = 0;
    var byS = {}, byT = {};
    c.qids.forEach(function (id) {
      var q = QMAP[id], r = c.res[id];
      if (!r) return;
      // 점수는 자가 판정이 기준이다. 키워드 적중률은 참고 지표로만 따로 집계한다.
      var credit = r.vd === 'ok' ? 1 : (r.vd === 'vague' ? 0.5 : 0);
      hitN += r.hit; totN += r.tot;
      if (r.vd === 'ok') okN++;
      var pt = q.points || (PASSING && PASSING.pointsPerQuestion) || 0;
      if (pt) { wsum += pt; wgot += pt * credit; }
      else excluded++;
      var sk = q.subject;
      if (!byS[sk]) byS[sk] = { n: 0, ok: 0, hit: 0, tot: 0 };
      byS[sk].n++; byS[sk].hit += r.hit; byS[sk].tot += r.tot;
      if (r.vd === 'ok') byS[sk].ok++;
      var tk = q.subject + '|' + q.cat2;
      if (!byT[tk]) byT[tk] = { n: 0, ok: 0, cat2: q.cat2, subject: q.subject };
      byT[tk].n++;
      if (r.vd === 'ok') byT[tk].ok++;
    });
    var answered = Object.keys(c.res).length;
    var rec = {
      id: c.id, at: new Date().toISOString(), mode: c.mode, label: c.label,
      n: c.qids.length, answered: answered,
      score: wsum > 0 ? Math.round((wgot / wsum) * 100) : null,
      excluded: excluded,
      kwRate: totN > 0 ? Math.round((hitN / totN) * 100) : 0,
      okRate: answered > 0 ? Math.round((okN / answered) * 100) : 0,
      byS: byS, byT: byT, qids: c.qids, res: c.res
    };
    S.history.unshift(rec);
    if (S.history.length > 60) S.history.length = 60;
    S.cur = null;
    save();
    return rec;
  }

  /* --------------------------------------------------------------- 아이콘 */

  var ICON = {
    home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    layers: '<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>',
    flag: '<path d="M5 21V4h13l-2.5 4L18 12H5"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
    play: '<path d="M7 4.5v15l13-7.5-13-7.5Z"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    x: '<path d="m6 6 12 12M18 6 6 18"/>',
    check: '<path d="m4 12 5.5 5.5L20 7"/>',
    book: '<path d="M4 4h9a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4z"/><path d="M20 4h-4v13.5H18a2 2 0 0 1 2 2z"/>'
  };
  function svg(name, cls) {
    return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
  }

  /* ------------------------------------------------------- 공통 UI 조각 */

  function meter(v, cls) {
    return '<div class="meter"><i class="' + (cls || '') + '" style="width:' +
      Math.max(0, Math.min(100, v)) + '%"></i></div>';
  }

  function gradePill(t) {
    if (!t || !SHOW_GRADE) return '';
    return '<span class="pill pill-' + (t.grade === 'A' ? 'gold' : 'out') + '">빈출 ' + t.grade + ' · ' + t.total + '회</span>';
  }

  function statusPill(id) {
    var p = progOf(id);
    if (!p || p.n === 0) return '<span class="pill pill-out">미학습</span>';
    if (p.st >= TOP) return '<span class="pill pill-solid">' + h(STATUS[TOP]) + '</span>';
    if (p.vd === 'no') return '<span class="pill pill-bad">모름</span>';
    if (p.vd === 'vague') return '<span class="pill pill-warn">애매함</span>';
    return '<span class="pill pill">' + STATUS[p.st] + '</span>';
  }

  function qcard(q, opts) {
    opts = opts || {};
    var t = topicOf(q);
    return '<button class="qcard" data-qid="' + q.id + '">' +
      '<div class="qtop">' +
        '<span class="pill pill-solid">' + h(sname(q.subject)) + '</span>' +
        '<span class="pill pill-out">' + h(roundLabel(q.round)) + ' ' + q.no + '번</span>' +
        (q.points ? '<span class="pill pill-out">' + q.points + '점</span>' : '') +
        (q.type ? '<span class="pill pill-out">' + h(q.type) + '</span>' : '') +
        (q.difficulty ? '<span class="pill pill-out">난이도 ' + h(q.difficulty) + '</span>' : '') +
        gradePill(t) + statusPill(q.id) +
        (progOf(q.id) && progOf(q.id).bm ? '<span class="pill pill-solid">★ 북마크</span>' : '') +
      '</div>' +
      '<div class="qsum">' + h(q.body) + '</div>' +
      (opts.showTopic === false ? '' : '<div class="qkw">' + h(q.cat1) + ' › ' + h(q.cat2) + '</div>') +
    '</button>';
  }

  function empty(title, body, cta) {
    return '<div class="empty"><div class="ei">' + svg('book') + '</div>' +
      '<h3>' + h(title) + '</h3><p>' + h(body) + '</p>' + (cta || '') + '</div>';
  }

  /* ================================================================ 라우터 */

  var NAV = [
    ['#/', '홈', 'home'],
    ['#/browse', '문제 탐색', 'search'],
    ['#/sets', '학습 세트', 'layers'],
    ['#/wrong', '오답 노트', 'flag'],
    ['#/stats', '학습 통계', 'chart'],
    ['#/settings', '설정', 'gear']
  ];

  function go(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  var VIEWS = {
    '': viewHome, '/': viewHome, '/browse': viewBrowse, '/sets': viewSets,
    '/study': viewStudy, '/result': viewResult, '/wrong': viewWrong,
    '/stats': viewStats, '/settings': viewSettings
  };

  function render() {
    var path = location.hash.replace(/^#/, '') || '/';
    var base = path.split('?')[0];
    var fn = VIEWS[base] || viewHome;
    try {
      $('#view').innerHTML = fn(path);
    } catch (err) {
      // 화면이 이전 상태에 멈춘 채로 남는 것이 가장 나쁘다 — 무슨 일인지 보여 준다
      $('#view').innerHTML = '<section class="section"><div class="wrap"><div class="card">' +
        '<h3 class="card-h">화면을 그리지 못했습니다</h3>' +
        '<p class="micro">' + h(err && err.message ? err.message : String(err)) + '</p>' +
        '<div class="btn-row" style="margin-top:1.6rem">' +
        '<a class="btn btn-fill" href="#/">홈으로</a>' +
        '<button class="btn btn-danger" data-act="drop-session">진행 중인 세트 비우기</button>' +
        '</div></div></div></section>';
      if (window.console && console.error) console.error(err);
    }
    paintNav(base);
    window.scrollTo(0, 0);
    var f = $('#frap');
    f.style.display = (base === '/study') ? 'none' : '';
    f.setAttribute('aria-label', S.cur ? '학습 이어하기' : '학습 시작하기');
  }

  function paintNav(base) {
    $$('[data-nav]').forEach(function (a) {
      a.classList.toggle('on', a.getAttribute('href') === '#' + (base === '/' ? '/' : base));
    });
  }

  /* ================================================================== 홈 */

  function viewHome() {
    var o = overall();
    var d = daysTo(S.goal.examDate);
    var cur = S.cur;
    var weak = weakTopics(5);

    var hero = '<section class="band-deep"><div class="wrap">' +
      '<p class="pill pill-out" style="margin-bottom:1.2rem">' + h(TITLE) + ' · 제' +
        ROUNDS[0] + '~' + ROUNDS[ROUNDS.length - 1] + RLABEL + ' · ' + DATA.meta.total + '문항</p>' +
      (d !== null
        ? '<div class="dday"><b class="serif">D' + (d > 0 ? '-' + d : (d === 0 ? '-DAY' : '+' + (-d))) + '</b>' +
          '<span class="dday-t">목표 시험일 ' + h(fmtDate(S.goal.examDate)) + '</span></div>'
        : '<h2 class="sec-h">오늘도 한 문항부터.</h2>' +
          '<p class="lead">목표 시험일을 등록하면 남은 기간과 하루 학습량을 함께 계산해 드립니다.</p>') +
      '<div style="margin-top:2rem" class="stat-row">' +
        '<div class="stat"><b>' + o.done + '</b><span>암기완료</span></div>' +
        '<div class="stat"><b>' + o.studied + '</b><span>학습한 문항</span></div>' +
        '<div class="stat"><b>' + o.wrong + '</b><span>오답 노트</span></div>' +
      '</div>' +
      '<div style="margin-top:1.6rem">' + meter(o.pc) +
        '<p class="micro" style="color:var(--on-dark-soft);margin-top:.8rem">회독 진척 ' + o.pc +
        '% · 암기완료 ' + o.done + ' / ' + o.total + '문항</p></div>' +
      '<div class="btn-row" style="margin-top:2.4rem">' +
        (cur
          ? '<a class="btn btn-inv" href="#/study">이어서 풀기 · ' + h(cur.label) + ' (' + (cur.i + 1) + '/' + cur.qids.length + ')</a>' +
            '<button class="btn btn-on-deep" data-act="drop-session">세션 그만두기</button>'
          : '<a class="btn btn-inv" href="#/sets">학습 세트 시작하기</a>' +
            '<a class="btn btn-on-deep" href="#/browse">문제 둘러보기</a>') +
      '</div>' +
      (d === null ? '<div style="margin-top:2rem;max-width:32rem"><label class="field" style="margin:0">' +
        '<span class="lbl" style="color:var(--on-dark-soft)">목표 시험일</span>' +
        '<input type="date" id="goal-date" value=""></label></div>' : '') +
    '</div></section>';

    if (o.studied === 0) {
      return hero + '<section class="section"><div class="wrap"><div class="card">' +
        empty('아직 학습 기록이 없습니다',
          '학습 세트를 시작하거나 문제 탐색에서 문항을 하나 골라 보세요. ' +
          (MODE === 'keyword' ? '자가 판정을 남기면' : '풀고 나면') + ' 오답 노트와 통계가 채워집니다.',
          '<div class="btn-row" style="justify-content:center"><a class="btn btn-fill" href="#/sets">학습 세트 시작</a>' +
          '<a class="btn btn-out" href="#/browse">문제 탐색</a></div>') +
        '</div></div></section>' + footer();
    }

    var subjects = '<section class="section"><div class="wrap">' +
      '<div class="head-row"><h2 class="sec-h">과목별 진척</h2>' +
      '<span class="muted">마지막 학습 ' + h(fmtDate(o.last)) + '</span></div>' +
      '<div class="card">' + SKEYS.map(function (k) {
        var st = subjStats(k);
        return '<div class="prog"><div class="t"><b>' + h(SUBJ[k].short) + '</b>' +
          '<span>회독 ' + st.pc + '% · 암기완료 ' + st.done + '/' + st.total +
          (st.wrong ? ' · 오답 ' + st.wrong : '') + '</span></div>' + meter(st.pc) + '</div>';
      }).join('') + '</div></div></section>';

    var weakBand = weak.length ? '<section class="band-deep"><div class="wrap">' +
      '<h2 class="sec-h">지금 손봐야 할 주제</h2>' +
      '<p class="lead">출제 빈도는 높은데 아직 회독이 덜 쌓인 주제입니다.</p>' +
      '<div class="heat" style="margin-top:2rem">' + weak.map(function (w) {
        return '<div class="heatrow"><span class="nm">' +
          '<span class="pill ' + (w.t.grade === 'A' ? 'pill-solid' : 'pill-out') + '" style="margin-right:.6rem">' + w.t.grade + '</span>' +
          h(w.t.cat2) + ' <span style="color:var(--on-dark-soft)">· ' + h(sname(w.t.subject)) + '</span></span>' +
          meter(w.m.pc) + '<span class="pc" style="color:var(--on-dark-soft)">' + w.m.pc + '%</span></div>';
      }).join('') + '</div>' +
      '<div class="btn-row" style="margin-top:2.4rem">' +
        '<button class="btn btn-inv" data-act="start-weak">취약 주제 집중 세트 시작</button>' +
        (o.wrong ? '<a class="btn btn-on-deep" href="#/wrong">오답 노트 ' + o.wrong + '문항</a>' : '') +
      '</div></div></section>' : '';

    var recent = S.history.length ? '<section class="section"><div class="wrap">' +
      '<div class="head-row"><h2 class="sec-h">최근 학습 기록</h2><a class="btn btn-out btn-sm" href="#/stats">통계 전체 보기</a></div>' +
      '<div class="card">' + S.history.slice(0, 5).map(function (r) {
        return '<div class="kv"><span>' + h(fmtDate(r.at)) + ' · ' + h(r.label) + '</span>' +
          '<b>' + (r.score === null ? '자가 ' + r.okRate + '%' : r.score + '점') + '</b></div>';
      }).join('') + '</div></div></section>' : '';

    return hero + subjects + weakBand + recent + footer();
  }

  /* =========================================================== 문제 탐색 */

  var BF = { subject: '', round: '', type: '', cat1: '', cat2: '', grade: '',
             difficulty: '', status: '', q: '', limit: 20 };

  function filtered() {
    var kw = norm(BF.q);
    return QS.filter(function (q) {
      if (BF.subject && q.subject !== BF.subject) return false;
      if (BF.round && String(q.round) !== BF.round) return false;
      if (BF.type && q.type !== BF.type) return false;
      if (BF.cat1 && q.cat1 !== BF.cat1) return false;
      if (BF.cat2 && q.cat2 !== BF.cat2) return false;
      if (BF.difficulty && q.difficulty !== BF.difficulty) return false;
      if (BF.grade) { var t = topicOf(q); if (!t || t.grade !== BF.grade) return false; }
      if (BF.status) {
        var p = progOf(q.id);
        if (BF.status === 'new' && p && p.n > 0) return false;
        if (BF.status === 'done' && !(p && p.st >= TOP)) return false;
        if (BF.status === 'wrong' && !isWrong(q.id)) return false;
        if (BF.status === 'doing' && !(p && p.n > 0 && p.st < TOP)) return false;
      }
      if (kw) {
        var hay = norm(q.body + ' ' + (q.keywords || []).join(' ') + ' ' +
          (q.choices || []).join(' ') + ' ' + (q.explanation || '') + ' ' +
          q.cat1 + ' ' + q.cat2 + ' ' + q.type);
        if (hay.indexOf(kw) < 0) return false;
      }
      return true;
    }).sort(function (a, b) {
      // 기본 정렬: 최신 회차 우선
      if (b.round !== a.round) return b.round - a.round;
      if (a.subject !== b.subject) return SKEYS.indexOf(a.subject) - SKEYS.indexOf(b.subject);
      return a.no - b.no;
    });
  }

  function opts(list, cur, mapper) {
    return list.map(function (v) {
      var o = mapper ? mapper(v) : { v: v, t: v };
      return '<option value="' + h(o.v) + '"' + (String(cur) === String(o.v) ? ' selected' : '') + '>' + h(o.t) + '</option>';
    }).join('');
  }

  function viewBrowse() {
    var list = filtered();
    var shown = list.slice(0, BF.limit);
    var types = {}, cat2s = {}, diffs = {};
    QS.forEach(function (q) {
      if (!BF.subject || q.subject === BF.subject) {
        if (q.type) types[q.type] = 1;
        if (q.cat2) cat2s[q.cat2] = 1;
        if (q.difficulty) diffs[q.difficulty] = 1;
      }
    });
    var DORDER = { '상': 0, '중': 1, '하': 2 };

    return '<section class="band-cream"><div class="wrap">' +
      '<h1 class="page-h">문제 탐색</h1>' +
      '<p class="sub">과목 · 회차 · 유형 · 빈출등급 · 학습상태로 좁혀 보세요. 문항을 누르면 바로 풀이가 시작됩니다.</p>' +
    '</div></section>' +
    '<section class="section"><div class="wrap">' +
      '<div class="card"><div class="fieldset fieldset-3">' +
        '<div class="wide"><input type="text" id="f-q" placeholder="키워드·주제 검색 (예: 구획증후군, 실손, 과실상계)" value="' + h(BF.q) + '"></div>' +
        '<select id="f-subject"><option value="">전체 과목</option>' +
          opts(SKEYS, BF.subject, function (k) { return { v: k, t: SUBJ[k].short }; }) + '</select>' +
        '<select id="f-round"><option value="">전체 회차</option>' +
          opts(ROUNDS.slice().reverse(), BF.round, function (r) { return { v: r, t: roundLabel(r) }; }) + '</select>' +
        '<select id="f-type"><option value="">전체 유형</option>' + opts(Object.keys(types).sort(), BF.type) + '</select>' +
        '<select id="f-cat2"><option value="">전체 주제</option>' + opts(Object.keys(cat2s).sort(), BF.cat2) + '</select>' +
        (Object.keys(diffs).length
          ? '<select id="f-difficulty"><option value="">전체 난이도</option>' +
            opts(Object.keys(diffs).sort(function (a, b) {
              return (DORDER[a] === undefined ? 9 : DORDER[a]) - (DORDER[b] === undefined ? 9 : DORDER[b]);
            }), BF.difficulty, function (d) { return { v: d, t: '난이도 ' + d }; }) + '</select>'
          : '') +
        (SHOW_GRADE
          ? '<select id="f-grade"><option value="">전체 빈출등급</option>' +
            opts(['A', 'B', 'C'], BF.grade, function (g) { return { v: g, t: g + '등급' }; }) + '</select>'
          : '') +
        '<select id="f-status"><option value="">전체 학습상태</option>' +
          opts([['new', '미학습'], ['doing', '학습 중'], ['done', '암기완료'], ['wrong', '오답 노트']], BF.status,
            function (p) { return { v: p[0], t: p[1] }; }) + '</select>' +
      '</div>' +
      '<div class="btn-row" style="margin-top:1.2rem">' +
        '<button class="btn btn-fill btn-sm" data-act="start-filtered">이 조건으로 세트 시작 (' + list.length + ')</button>' +
        '<button class="btn btn-out btn-sm" data-act="reset-filter">필터 초기화</button>' +
      '</div></div>' +
      '<p class="count-line">' + list.length + '문항 · 최신 회차순' + (list.length > shown.length ? ' · ' + shown.length + '개 표시 중' : '') + '</p>' +
      (list.length
        ? '<div class="qlist">' + shown.map(function (q) { return qcard(q); }).join('') + '</div>' +
          (list.length > shown.length
            ? '<div class="btn-row" style="justify-content:center;margin-top:2.4rem">' +
              '<button class="btn btn-out" data-act="more">더 보기 (' + (list.length - shown.length) + '문항 남음)</button></div>'
            : '')
        : empty('조건에 맞는 문항이 없습니다', '필터를 넓히거나 검색어를 지워 보세요.',
            '<button class="btn btn-out" data-act="reset-filter">필터 초기화</button>')) +
    '</div></section>' + footer();
  }

  /* ============================================================ 학습 세트 */

  var SF = { subject: SKEYS[0], round: ROUNDS[ROUNDS.length - 1], count: 10 };

  function viewSets() {
    var wrongN = wrongIds().length;
    var hotN = QS.filter(function (q) { var t = topicOf(q); return t && t.grade === 'A'; }).length;

    return '<section class="band-cream"><div class="wrap">' +
      '<h1 class="page-h">학습 세트</h1>' +
      '<p class="sub">한 번에 풀 문항 묶음을 만듭니다. 중간에 나가도 진행 상태가 저장돼 이어서 풀 수 있습니다.</p>' +
    '</div></section>' +
    (S.cur ? '<section class="section"><div class="wrap"><div class="card card-deep">' +
      '<h3 class="card-h">진행 중인 세트가 있습니다</h3>' +
      '<p class="micro" style="color:var(--on-dark-soft)">' + h(S.cur.label) + ' · ' +
        (S.cur.i + 1) + '/' + S.cur.qids.length + '문항</p>' +
      '<div class="btn-row" style="margin-top:1.6rem"><a class="btn btn-inv" href="#/study">이어서 풀기</a>' +
      '<button class="btn btn-on-deep" data-act="drop-session">그만두고 새로 시작</button></div>' +
      '</div></div></section>' : '') +

    '<section class="section"><div class="wrap"><div class="cards cards-2">' +

      '<div class="card"><h3 class="card-h">회차 모의고사</h3>' +
        '<p class="micro">' + (PASSING
          ? '한 회차를 전 과목 통째로 풀면 합격·과락까지 판정합니다.'
          : '실제 시험 한 회차를 문항 순서 그대로 풉니다.') + '</p>' +
        '<div class="fieldset" style="margin-top:1.6rem">' +
          '<select id="s-subject">' +
            (PASSING ? '<option value="">전 과목 (실전)</option>' : '') +
            opts(SKEYS, PASSING ? '' : SF.subject, function (k) { return { v: k, t: SUBJ[k].short }; }) +
          '</select>' +
          '<select id="s-round">' + opts(ROUNDS.slice().reverse(), SF.round, function (r) { return { v: r, t: roundLabel(r) }; }) + '</select>' +
        '</div>' +
        '<button class="btn btn-fill btn-block" data-act="start-round">모의고사 시작</button></div>' +

      '<div class="card"><h3 class="card-h">랜덤 세트</h3>' +
        '<p class="micro">선택한 과목 범위에서 무작위로 뽑아 풉니다.</p>' +
        '<div style="margin-top:1.6rem;margin-bottom:1.6rem">' +
          '<select id="r-subject" style="margin-bottom:1.2rem"><option value="">전체 과목</option>' +
            opts(SKEYS, '', function (k) { return { v: k, t: SUBJ[k].short }; }) + '</select>' +
          '<div class="stepper"><button data-act="cnt-" aria-label="문항 수 줄이기">−</button>' +
            '<b id="r-count">' + SF.count + '</b>' +
            '<button data-act="cnt+" aria-label="문항 수 늘리기">＋</button>' +
            '<span class="micro">문항</span></div>' +
        '</div>' +
        '<button class="btn btn-fill btn-block" data-act="start-random">랜덤 세트 시작</button></div>' +

      '<div class="card card-ceremony"><h3 class="card-h">빈출 A등급 집중</h3>' +
        '<p class="micro">' + ROUNDS.length + '개 회차에서 ' + THRESH.A +
          '회 이상 출제된 주제만 모읍니다. 총 ' + hotN + '문항.</p>' +
        '<div style="margin-top:1.6rem;margin-bottom:1.6rem">' +
          '<select id="h-subject"><option value="">전체 과목</option>' +
            opts(SKEYS, '', function (k) { return { v: k, t: SUBJ[k].short }; }) + '</select></div>' +
        '<button class="btn btn-fill btn-block" data-act="start-hotspot">빈출 세트 시작</button></div>' +

      '<div class="card"><h3 class="card-h">취약 주제 집중</h3>' +
        '<p class="micro">출제 빈도 대비 회독이 덜 쌓인 주제를 우선 배치합니다.</p>' +
        '<div style="margin-top:1.6rem;margin-bottom:1.6rem">' +
          '<select id="w-subject"><option value="">전체 과목</option>' +
            opts(SKEYS, '', function (k) { return { v: k, t: SUBJ[k].short }; }) + '</select></div>' +
        '<button class="btn btn-fill btn-block" data-act="start-weak">취약 세트 시작</button></div>' +

    '</div>' +
    (wrongN ? '<div class="card card-deep" style="margin-top:1.6rem">' +
      '<h3 class="card-h">오답 다시풀기</h3>' +
      '<p class="micro" style="color:var(--on-dark-soft)">애매함·모름으로 판정했거나 북마크한 ' + wrongN + '문항.</p>' +
      '<div class="btn-row" style="margin-top:1.6rem">' +
        '<button class="btn btn-inv" data-act="start-wrong">오답 세트 시작</button>' +
        '<a class="btn btn-on-deep" href="#/wrong">오답 노트 보기</a></div></div>' : '') +
    '</div></section>' + footer();
  }

  /* ================================================================ 풀이 */

  function viewStudy() {
    var c = S.cur;
    if (!c) {
      return '<section class="section"><div class="wrap"><div class="card">' +
        empty('진행 중인 세트가 없습니다', '학습 세트를 시작하거나 문제 탐색에서 문항을 골라 주세요.',
          '<div class="btn-row" style="justify-content:center"><a class="btn btn-fill" href="#/sets">학습 세트</a>' +
          '<a class="btn btn-out" href="#/browse">문제 탐색</a></div>') + '</div></div></section>' + footer();
    }
    if (c.i >= c.qids.length) return viewStudyDone();

    var q = QMAP[c.qids[c.i]];
    var r = c.res[q.id];
    var t = topicOf(q);
    // 아직 한 번도 푼 적 없는 문항은 기록이 없다 — 읽기 전용 기본값으로 대체한다
    var p = progOf(q.id) || { st: 0, vd: null, hit: 0, tot: 0, n: 0, at: null, ans: '', bm: false };
    var graded = !!r;

    var head = '<section class="band-deep"><div class="wrap qhead">' +
      '<div class="study-bar">' +
        '<span class="pos">' + (c.i + 1) + ' / ' + c.qids.length + '</span>' +
        meter(pct(c.i, c.qids.length)) +
        '<button class="btn btn-on-deep btn-sm" data-act="exit-session">나가기</button>' +
      '</div>' +
      '<div class="pills">' +
        (c.mode === 'single' ? '' : '<span class="pill pill-out">' + h(c.label) + '</span>') +
        '<span class="pill pill-out">' + h(sname(q.subject)) + '</span>' +
        '<span class="pill pill-out">' + h(roundLabel(q.round)) + ' ' + q.no + '번</span>' +
        (function () {
          // 문항마다 배점이 적힌 시험도 있고, 합격 기준에 '1문항 N점'으로만 적힌 시험도 있다
          var pt = q.points || (PASSING && PASSING.pointsPerQuestion);
          return pt ? '<span class="pill pill-out">' + pt + '점</span>' : '';
        })() +
        '<span class="pill pill-out">' + h(q.type) + '</span>' +
        (p.n > 0 ? '<span class="pill pill-out">' + STATUS[p.st] + ' · ' + p.n + '회 풀이</span>' : '') +
      '</div>' +
      '<h2 class="qtext">' + h(q.body) + '</h2>' +
    '</div></section>';

    var body;
    if (!graded && modeOf(q) === 'choice') {
      body = '<section class="section"><div class="wrap"><div class="card">' +
        '<div class="choices">' + (q.choices || []).map(function (c, i) {
          return '<button class="choice" data-pick="' + i + '">' +
            '<span class="cn">' + (i + 1) + '</span><span class="ct">' + h(c) + '</span></button>';
        }).join('') + '</div>' +
        (!(q.choices || []).length
          ? '<p class="micro">이 문항에는 선택지 데이터가 없습니다. 원본 엑셀을 확인하세요.</p>'
          : '<p class="micro">고르면 바로 채점됩니다.</p>') +
        '<div class="btn-row" style="margin-top:1.6rem">' +
          '<button class="btn btn-out" data-act="giveup">모르겠음 · 답 보기</button>' +
        '</div></div></div></section>';
    } else if (!graded && modeOf(q) !== 'short') {
      body = '<section class="section"><div class="wrap">' +
        '<div class="card">' +
          '<label class="field" style="margin-bottom:1.2rem"><span class="lbl">답안 — 떠오르는 핵심 요소를 적어 보세요</span>' +
          '<textarea id="ans" placeholder="키워드가 드러나게 아는 만큼 적어 보세요. 문장이 아니어도 됩니다."></textarea></label>' +
          '<p class="micro">' + (q.keywords || []).length + '개 키워드로 자동 대조합니다. ' +
            '정확한 채점은 다음 단계의 자가 판정으로 확정됩니다.</p>' +
          '<div class="btn-row" style="margin-top:1.6rem">' +
            '<button class="btn btn-fill" data-act="submit">채점하기</button>' +
            '<button class="btn btn-out" data-act="giveup">모르겠음 · 답 보기</button>' +
          '</div>' +
        '</div></div></section>';
    } else if (!graded && modeOf(q) === 'short') {
      body = '<section class="section"><div class="wrap"><div class="card">' +
        '<div class="blanks">' + (q.blanks || []).map(function (b, i) {
          return '<label class="blank">' +
            (b.label ? '<span class="blabel">' + h(b.label) + '</span>' : '') +
            '<input type="text" data-blank="' + i + '" autocomplete="off" ' +
            'autocapitalize="off" spellcheck="false" ' +
            'placeholder="' + (b.set ? '해당 기호를 모두 입력 (순서 무관)'
              : (q.blanks.length > 1) ? '빈칸 ' + (i + 1) : '답을 입력하세요') + '">' +
          '</label>';
        }).join('') + '</div>' +
        '<p class="micro" style="margin-top:1.2rem">정확히 일치해야 정답입니다. ' +
          '시험이 인정하는 다른 표기도 함께 받아줍니다.</p>' +
        '<div class="btn-row" style="margin-top:1.6rem">' +
          '<button class="btn btn-fill" data-act="submit-short">제출하기</button>' +
          '<button class="btn btn-out" data-act="giveup">모르겠음 · 답 보기</button>' +
        '</div></div></div></section>';
    } else if (modeOf(q) === 'short') {
      body = viewGradedShort(q, r, t, p);
    } else if (modeOf(q) === 'choice') {
      body = viewGradedChoice(q, r, t, p);
    } else {
      var hitTags = r.hits.map(function (x) {
        return '<span class="kwtag ' + (x.hit ? 'hit' : 'miss') + '">' + (x.hit ? '✓ ' : '· ') + h(x.kw) + '</span>';
      }).join('');
      body = '<section class="section"><div class="wrap">' +
        '<div class="card">' +
          '<div class="head-row" style="margin-bottom:1.2rem"><h3 class="card-h" style="margin:0">키워드 적중 ' + r.hit + ' / ' + r.tot + '</h3>' +
            '<span class="pill ' + (r.hit === r.tot ? 'pill-solid' : (r.hit > 0 ? 'pill' : 'pill-bad')) + '">' +
            pct(r.hit, r.tot) + '%</span></div>' +
          '<div class="kwres">' + hitTags + '</div>' +
          '<p class="micro">키워드 대조는 참고 수치입니다. 실제 학습 상태는 아래 자가 판정으로 기록됩니다.</p>' +
        '</div>' +

        '<div class="card recall" style="margin-top:1.6rem">' +
          '<div class="rl">주제 · 출제 이력</div>' +
          '<div class="pills" style="margin-bottom:1.2rem">' +
            '<span class="pill pill-solid">' + h(q.cat1) + '</span>' +
            '<span class="pill pill-out">' + h(q.cat2) + '</span>' + gradePill(t) +
            (t && t.due ? '<span class="pill pill-solid">재출제 유력</span>' : '') +
            (t ? '<span class="pill pill-out">최근 5년 ' + t.recent + '회</span>' : '') +
          '</div>' +
          (q.similar.length
            ? '<div class="kv"><span>유사 기출</span><b>' + h(q.similar.join(' · ')) + '</b></div>'
            : '<p class="micro">기록된 유사 기출이 없습니다.</p>') +
        '</div>' +

        (r.ans ? '<div class="card" style="margin-top:1.6rem"><div class="rl" style="font-size:1.3rem;font-weight:700;' +
          'text-transform:uppercase;letter-spacing:.325px;color:var(--ink-soft);margin-bottom:.8rem">내가 쓴 답안</div>' +
          '<div class="answer-echo">' + h(r.ans) + '</div></div>' : '') +

        '<div class="card" style="margin-top:1.6rem">' +
          '<h3 class="card-h">스스로 판정하기</h3>' +
          '<p class="micro" style="margin-bottom:1.6rem">이 판정이 학습 상태와 오답 노트의 기준이 됩니다.</p>' +
          '<div class="verdicts">' +
            '<button class="v-ok" data-vd="ok">알았음<small>회독 +1</small></button>' +
            '<button class="v-vague" data-vd="vague">애매함<small>오답 노트 등록</small></button>' +
            '<button class="v-no" data-vd="no">모름<small>미학습으로</small></button>' +
          '</div>' +
          '<div class="btn-row" style="margin-top:1.6rem">' +
            '<button class="btn btn-out btn-sm" data-act="bookmark">' +
              (p.bm ? '★ 북마크 해제' : '☆ 북마크') + '</button>' +

          '</div>' +
        '</div>' +
      '</div></section>';
    }
    return head + body;
  }

  /* 객관식 결과 — 정답이 객관적으로 정해지므로 자가 판정을 묻지 않고 바로 다음으로 넘긴다.
     대신 해설을 크게 보여준다. 여기서 배우는 게 목적이라. */
  function viewGradedChoice(q, r, t, p) {
    var ch = q.choices || [];
    return '<section class="section"><div class="wrap">' +
      '<div class="card">' +
        '<div class="head-row" style="margin-bottom:1.2rem">' +
          '<h3 class="card-h" style="margin:0">' + (r.correct ? '정답입니다' : '틀렸습니다') + '</h3>' +
          '<span class="pill ' + (r.correct ? 'pill-solid' : 'pill-bad') + '">' +
            (r.correctIdx >= 0 ? '정답 ' + (r.correctIdx + 1) + '번' : '정답 미상') + '</span>' +
        '</div>' +
        '<div class="choices">' + ch.map(function (c, i) {
          var cls = 'choice done';
          if (i === r.correctIdx) cls += ' is-answer';
          if (i === r.pick && i !== r.correctIdx) cls += ' is-wrong';
          return '<div class="' + cls + '"><span class="cn">' + (i + 1) + '</span>' +
            '<span class="ct">' + h(c) + '</span></div>';
        }).join('') + '</div>' +
        (r.pick < 0 ? '<p class="micro">답을 보지 않고 넘겼습니다.</p>' : '') +
      '</div>' +

      (q.explanation ? '<div class="card recall" style="margin-top:1.6rem">' +
        '<div class="rl">해설</div><div class="expl">' + h(q.explanation) + '</div></div>' : '') +

      '<div class="card recall" style="margin-top:1.6rem">' +
        '<div class="rl">주제 · 출제 이력</div>' +
        '<div class="pills" style="margin-bottom:1.2rem">' +
          (q.cat1 ? '<span class="pill pill-solid">' + h(q.cat1) + '</span>' : '') +
          (q.cat2 ? '<span class="pill pill-out">' + h(q.cat2) + '</span>' : '') + gradePill(t) +
          (t && t.due ? '<span class="pill pill-solid">재출제 유력</span>' : '') +
        '</div>' +
        (q.similar.length
          ? '<div class="kv"><span>유사 기출</span><b>' + h(q.similar.join(' · ')) + '</b></div>'
          : '<p class="micro">기록된 유사 기출이 없습니다.</p>') +
      '</div>' +

      '<div class="card" style="margin-top:1.6rem">' +
        '<div class="btn-row">' +
          '<button class="btn btn-fill" data-act="next-choice">다음 문항</button>' +
          '<button class="btn btn-out" data-act="mark-unsure">헷갈렸음 · 오답 노트에 담기</button>' +
          '<button class="btn btn-out" data-act="bookmark">' +
            (p.bm ? '★ 북마크 해제' : '☆ 북마크') + '</button>' +
        '</div>' +
      '</div>' +
    '</div></section>';
  }

  /* 단답형 결과 — 정답이 객관적이라 자가 판정을 묻지 않는다.
     대신 내가 쓴 답과 정답·인정답안을 나란히 보여준다. 여기서 배우는 게 목적이다. */
  function viewGradedShort(q, r, t, p) {
    var bl = q.blanks || [];
    return '<section class="section"><div class="wrap">' +
      '<div class="card">' +
        '<div class="head-row" style="margin-bottom:1.2rem">' +
          '<h3 class="card-h" style="margin:0">' +
            (r.correct ? '정답입니다'
              : (r.hit > 0 ? '부분 정답' : '틀렸습니다')) + '</h3>' +
          '<span class="pill ' + (r.correct ? 'pill-solid' : 'pill-bad') + '">' +
            r.hit + ' / ' + r.tot + '</span>' +
        '</div>' +
        '<div class="ans-reveal">' + bl.map(function (b, i) {
          var ok = r.marks[i];
          var mine = (r.typed || [])[i];
          return '<div class="ans-row">' +
            (b.label ? '<span class="blabel">' + h(b.label) + '</span>' : '') +
            '<span><b>' + h(b.answer) + '</b>' +
            (b.accepted && b.accepted.length
              ? '<span class="acc"> · 인정: ' + h(b.accepted.join(', ')) + '</span>' : '') +
            (b.note ? '<span class="acc"> (' + h(b.note) + ')</span>' : '') +
            '<br><span class="acc">' + (mine ? '내 답: ' + h(mine) : '입력 없음') +
            ' <span class="mark ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓' : '✗') +
            '</span></span></span></div>';
        }).join('') + '</div>' +
      '</div>' +

      (q.explanation ? '<div class="card recall" style="margin-top:1.6rem">' +
        '<div class="rl">해설</div><div class="expl">' + h(q.explanation) + '</div></div>' : '') +

      '<div class="card recall" style="margin-top:1.6rem">' +
        '<div class="rl">주제</div>' +
        '<div class="pills">' +
          (q.cat1 ? '<span class="pill pill-solid">' + h(q.cat1) + '</span>' : '') +
          (q.cat2 ? '<span class="pill pill-out">' + h(q.cat2) + '</span>' : '') +
          (q.difficulty ? '<span class="pill pill-out">난이도 ' + h(q.difficulty) + '</span>' : '') +
          gradePill(t) +
        '</div>' +
      '</div>' +

      '<div class="card" style="margin-top:1.6rem"><div class="btn-row">' +
        '<button class="btn btn-fill" data-act="next-choice">다음 문항</button>' +
        (r.correct ? '<button class="btn btn-out" data-act="mark-unsure">헷갈렸음 · 오답 노트에</button>' : '') +
        '<button class="btn btn-out" data-act="bookmark">' +
          (p.bm ? '★ 북마크 해제' : '☆ 북마크') + '</button>' +
      '</div></div>' +
    '</div></section>';
  }

  function viewStudyDone() {
    return '<section class="section"><div class="wrap"><div class="card">' +
      empty('세트를 모두 풀었습니다', '결과를 확인하고 틀린 문항을 바로 복습해 보세요.',
        '<button class="btn btn-fill" data-act="finish">결과 보기</button>') +
      '</div></div></section>';
  }

  /* ================================================================ 결과 */

  function viewResult(path) {
    var qs = path.split('?')[1] || '';
    var id = (qs.match(/id=([^&]+)/) || [])[1];
    var r = id ? S.history.filter(function (x) { return x.id === id; })[0] : S.history[0];
    if (!r) {
      return '<section class="section"><div class="wrap"><div class="card">' +
        empty('결과 기록이 없습니다', '학습 세트를 완료하면 결과가 여기에 남습니다.',
          '<a class="btn btn-fill" href="#/sets">학습 세트</a>') + '</div></div></section>' + footer();
    }

    var wrongInSet = r.qids.filter(function (qid) {
      var x = r.res[qid];
      return x && x.vd !== 'ok';
    });

    var byTopic = Object.keys(r.byT).map(function (k) { return r.byT[k]; })
      .sort(function (a, b) { return (a.ok / a.n) - (b.ok / b.n); });

    var J = judge(r);

    return '<section class="band-deep"><div class="wrap">' +
      '<p class="pill pill-out">' + h(MODE_LABEL[r.mode] || r.mode) + ' · ' + h(fmtDate(r.at)) + '</p>' +
      (J ? passCard(J) : '') +
      /* 합격 판정 카드가 있으면 점수를 두 번 보여주지 않는다 — 어느 쪽이 진짜인지 헷갈린다 */
      (J ? '' :
        '<div class="score"><b class="serif">' + (r.score === null ? r.okRate : r.score) + '</b>' +
        '<span class="sl">' + (r.score === null
          ? (MODE === 'keyword' ? '자가 판정 정답률 (%)' : '정답률 (%)')
          : '배점 가중 점수 (100점 만점)') + '</span></div>') +
      '<div class="stat-row" style="margin-top:1.6rem">' +
        '<div class="stat"><b>' + r.answered + '/' + r.n + '</b><span>푼 문항</span></div>' +
        (MODE === 'keyword'
          ? '<div class="stat"><b>' + r.kwRate + '%</b><span>키워드 적중</span></div>'
          : '<div class="stat"><b>' + (r.byT ? Object.keys(r.byT).length : 0) + '</b><span>다룬 주제</span></div>') +
        '<div class="stat"><b>' + r.okRate + '%</b><span>' +
          (MODE === 'keyword' ? '자가 정답률' : '정답률') + '</span></div>' +
      '</div>' +
      (r.excluded ? '<p class="micro" style="margin-top:1.2rem">' +
        '※ 배점이 없는 ' + r.excluded + '문항은 가중 점수 계산에서 제외했습니다.</p>' : '') +
      '<div class="btn-row" style="margin-top:2.4rem">' +
        (wrongInSet.length ? '<button class="btn btn-inv" data-act="review-set" data-ids="' + wrongInSet.join(',') + '">' +
          '틀린 ' + wrongInSet.length + '문항 다시 풀기</button>' : '') +
        '<a class="btn btn-on-deep" href="#/sets">새 세트 시작</a>' +
      '</div>' +
    '</div></section>' +

    '<section class="section"><div class="wrap">' +
      '<h2 class="sec-h">과목별</h2>' +
      '<div class="card" style="margin-top:1.6rem">' + Object.keys(r.byS).map(function (k) {
        var b = r.byS[k];
        return '<div class="prog"><div class="t"><b>' + h(sname(k)) + '</b>' +
          '<span>' + b.ok + '/' + b.n + ' 자가정답 · 키워드 ' + pct(b.hit, b.tot) + '%</span></div>' +
          meter(pct(b.ok, b.n)) + '</div>';
      }).join('') + '</div>' +

      (byTopic.length > 1 ? '<h2 class="sec-h" style="margin-top:3.2rem">주제별</h2>' +
        '<div class="card" style="margin-top:1.6rem"><div class="heat">' + byTopic.map(function (b) {
          return '<div class="heatrow"><span class="nm">' + h(b.cat2) +
            ' <span class="muted">· ' + h(sname(b.subject)) + '</span></span>' +
            meter(pct(b.ok, b.n)) + '<span class="pc">' + b.ok + '/' + b.n + '</span></div>';
        }).join('') + '</div></div>' : '') +

      '<h2 class="sec-h" style="margin-top:3.2rem">문항별</h2>' +
      '<div class="card" style="margin-top:1.6rem">' + r.qids.map(function (qid, i) {
        var q = QMAP[qid], x = r.res[qid];
        var vd = x ? x.vd : null;
        var pill = vd === 'ok' ? '<span class="pill pill">알았음</span>'
          : vd === 'vague' ? '<span class="pill pill-warn">애매함</span>'
          : vd === 'no' ? '<span class="pill pill-bad">모름</span>'
          : '<span class="pill pill-out">미응답</span>';
        return '<div class="rrow"><span class="n">' + (i + 1) + '</span>' +
          '<span class="rt"><b>' + h(q.body) + '</b>' +
          '<small>' + h(sname(q.subject)) + ' · ' + h(roundLabel(q.round)) + ' ' + q.no + '번' +
          (x ? ' · 키워드 ' + x.hit + '/' + x.tot : '') + '</small></span>' + pill + '</div>';
      }).join('') + '</div>' +
    '</div></section>' + footer();
  }

  /* ============================================================= 오답 노트 */

  var WF = { subject: '', kind: '' };

  function viewWrong() {
    var ids = wrongIds().filter(function (id) {
      var q = QMAP[id], p = progOf(id);
      if (WF.subject && q.subject !== WF.subject) return false;
      if (WF.kind === 'no' && p.vd !== 'no') return false;
      if (WF.kind === 'vague' && p.vd !== 'vague') return false;
      if (WF.kind === 'bm' && !p.bm) return false;
      return true;
    }).sort(function (a, b) {
      var pa = progOf(a), pb = progOf(b);
      var rank = { no: 0, vague: 1 };
      var ra = rank[pa.vd] === undefined ? 2 : rank[pa.vd];
      var rb = rank[pb.vd] === undefined ? 2 : rank[pb.vd];
      if (ra !== rb) return ra - rb;
      return (pb.at || '').localeCompare(pa.at || '');
    });

    var all = wrongIds().length;

    return '<section class="band-cream"><div class="wrap">' +
      '<h1 class="page-h">오답 노트</h1>' +
      '<p class="sub">' + (MODE === 'choice'
        ? '틀린 문항과 “헷갈렸음”으로 담은 문항, 직접 북마크한 문항이 모입니다. 다시 맞히면 자동으로 빠집니다.'
        : '자가 판정에서 “애매함 · 모름”으로 남긴 문항과 직접 북마크한 문항이 모입니다. “알았음”으로 판정하면 자동으로 빠집니다.') + '</p>' +
    '</div></section>' +
    '<section class="section"><div class="wrap">' +
      (all ? '<div class="card"><div class="fieldset">' +
        '<select id="w-f-subject"><option value="">전체 과목</option>' +
          opts(SKEYS, WF.subject, function (k) { return { v: k, t: SUBJ[k].short }; }) + '</select>' +
        '<select id="w-f-kind"><option value="">전체 상태</option>' +
          opts([['no', '모름'], ['vague', '애매함'], ['bm', '북마크']], WF.kind,
            function (p) { return { v: p[0], t: p[1] }; }) + '</select>' +
      '</div>' +
      '<div class="btn-row" style="margin-top:1.2rem">' +
        '<button class="btn btn-fill btn-sm" data-act="start-wrong-filtered" data-ids="' + ids.join(',') + '">' +
          '이 ' + ids.length + '문항 다시 풀기</button>' +
      '</div></div>' +
      '<p class="count-line">' + ids.length + '문항 · 모름 → 애매함 → 북마크 순</p>' +
      (ids.length
        ? '<div class="qlist">' + ids.map(function (id) {
            return qcard(QMAP[id]) ;
          }).join('') + '</div>'
        : empty('필터에 맞는 문항이 없습니다', '조건을 넓혀 보세요.', ''))
      : empty('오답 노트가 비어 있습니다',
          '문항을 풀고 “애매함” 또는 “모름”으로 판정하면 여기에 쌓입니다. 북마크한 문항도 함께 모입니다.',
          '<div class="btn-row" style="justify-content:center"><a class="btn btn-fill" href="#/sets">학습 세트 시작</a></div>')) +
    '</div></section>' + footer();
  }

  /* ============================================================= 학습 통계 */

  function viewStats() {
    var o = overall();
    if (!S.history.length && o.studied === 0) {
      return '<section class="section"><div class="wrap"><div class="card">' +
        empty('아직 통계로 보여 드릴 기록이 없습니다',
          '학습 세트를 한 번 완료하면 점수 추이와 주제별 숙달도가 나타납니다.',
          '<a class="btn btn-fill" href="#/sets">학습 세트 시작</a>') + '</div></div></section>' + footer();
    }

    var hist = S.history.slice(0, 12).reverse();
    var vals = hist.map(function (r) { return r.score === null ? r.okRate : r.score; });

    var typeStat = {};
    QS.forEach(function (q) {
      var p = progOf(q.id);
      if (!typeStat[q.type]) typeStat[q.type] = { n: 0, sum: 0 };
      typeStat[q.type].n++;
      typeStat[q.type].sum += p ? (p.st || 0) : 0;
    });

    return '<section class="band-cream"><div class="wrap">' +
      '<h1 class="page-h">학습 통계</h1>' +
      '<p class="sub">' + (MODE === 'choice'
        ? '정답 여부를 기준으로 집계합니다.'
        : '자가 판정을 기준으로 집계합니다. 키워드 적중률은 참고 지표로 함께 표시합니다.') + '</p>' +
    '</div></section>' +

    '<section class="section"><div class="wrap">' +
      '<div class="stat-row">' +
        '<div class="stat"><b>' + o.pc + '%</b><span>전체 회독 진척</span></div>' +
        '<div class="stat"><b>' + S.history.length + '</b><span>완료 세트</span></div>' +
        '<div class="stat"><b>' + o.wrong + '</b><span>오답 노트</span></div>' +
      '</div>' +

      (vals.length > 1 ? '<h2 class="sec-h" style="margin-top:3.2rem">세트 점수 추이</h2>' +
        '<div class="card" style="margin-top:1.6rem">' + lineChart(vals, hist) + '</div>' : '') +

  /* 합격 판정 카드. 부분 응시일 때 "불합격"이라고 단정하지 않는다 —
     안 푼 문항을 0점으로 세어 떨어졌다고 말하면 학습 의욕만 꺾는다. */
  function passCard(J) {

  function lineChart(vals, hist) {
    var W = 640, H = 220, pad = 34;
    // 테마를 갈아끼워도 차트가 혼자 옛 색으로 남지 않도록 CSS 변수에서 읽는다
    var cs = getComputedStyle(document.documentElement);
    var LINE = (cs.getPropertyValue('--brand-cta') || '#26635c').trim();
    var GRID = (cs.getPropertyValue('--hairline') || '#e7e7e7').trim();
    var n = vals.length;
    var max = Math.max(100, Math.max.apply(null, vals));
    var x = function (i) { return pad + (n === 1 ? (W - pad * 2) / 2 : (i * (W - pad * 2)) / (n - 1)); };
    var y = function (v) { return H - pad - (v / max) * (H - pad * 2); };
    var pts = vals.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ');
    var grid = [0, 25, 50, 75, 100].map(function (g) {
      return '<line x1="' + pad + '" y1="' + y(g) + '" x2="' + (W - pad) + '" y2="' + y(g) +
        '" stroke="' + GRID + '" stroke-width="1"/>' +
        '<text x="' + (pad - 8) + '" y="' + (y(g) + 4) + '" text-anchor="end" font-size="11" fill="rgba(0,0,0,.38)">' + g + '</text>';
    }).join('');
    var dots = vals.map(function (v, i) {
      return '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="4.5" fill="' + LINE + '"/>' +
        '<title>' + h(hist[i].label + ' · ' + fmtDate(hist[i].at) + ' · ' + v) + '</title>';
    }).join('');
    return '<div class="scroll-x"><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="최근 세트 점수 추이">' + grid +
      '<polyline points="' + pts + '" fill="none" stroke="' + LINE + '" stroke-width="2.5" ' +
      'stroke-linecap="round" stroke-linejoin="round"/>' + dots + '</svg></div>' +
      '<p class="micro" style="margin-top:.8rem">최근 ' + n + '개 세트 · 배점 가중 점수(없으면 자가 정답률)</p>';
  }

      SKEYS.length + '과목 ' + DATA.meta.total + '문항.<br>' +

      '기기를 바꾸거나 브라우저 데이터를 지우기 전에 설정 → 내보내기로 백업하세요.</p></div>' +
    '</div></div></footer>';

  /* ============================================================ 이벤트 */

  function setVerdict(vd) {
    var c = S.cur;
    var q = QMAP[c.qids[c.i]];
    var r = c.res[q.id];
    if (!r) return;
    var p = prog(q.id);
    r.vd = vd;
    p.vd = vd;
    p.hit = r.hit; p.tot = r.tot;
    p.ans = r.ans;
    p.n = (p.n || 0) + 1;
    p.at = new Date().toISOString();
    if (vd === 'ok') p.st = Math.min(TOP, (p.st || 0) + 1);
    else if (vd === 'no') p.st = 0;
    // 애매함 → 회독 유지
    c.i++;
    save();
    if (c.i >= c.qids.length) {
      var rec = finishSession();
      go('#/result?id=' + rec.id);
    } else {
      render();
    }
  }

  function submitAnswer(text) {
    var c = S.cur;
    var q = QMAP[c.qids[c.i]];
    var g = grade(q, text);
    c.res[q.id] = { hit: g.hit, tot: g.tot, hits: g.hits, ans: text, vd: null };
    save();
    render();
  }

  /* 객관식은 정답이 객관적이라 고르는 순간 판정까지 끝난다.
     맞으면 회독 +1, 틀리면 미학습으로 되돌리고 오답 노트에 담는다. */
  function pickChoice(idx) {
    var c = S.cur;
    var q = QMAP[c.qids[c.i]];
    var g = gradeChoice(q, idx);
    var p = prog(q.id);
    c.res[q.id] = { hit: g.hit, tot: 1, pick: idx, correctIdx: g.correctIdx,
                    correct: g.correct, ans: idx >= 0 ? String(idx + 1) : '',
                    vd: g.correct ? 'ok' : 'no' };
    p.vd = c.res[q.id].vd;
    p.hit = g.hit; p.tot = 1;
    p.ans = c.res[q.id].ans;
    p.n = (p.n || 0) + 1;
    p.at = new Date().toISOString();
    if (g.correct) p.st = Math.min(TOP, (p.st || 0) + 1);
    else p.st = 0;
    save();
    render();
  }

  function submitShort(typed) {
    var c = S.cur;
    var q = QMAP[c.qids[c.i]];
    var g = gradeShort(q, typed);
    var p = prog(q.id);
    c.res[q.id] = { hit: g.hit, tot: g.tot, marks: g.marks, typed: typed,
                    correct: g.correct, ans: (typed || []).join(' / '),
                    vd: g.correct ? 'ok' : 'no' };
    p.vd = c.res[q.id].vd;
    p.hit = g.hit; p.tot = g.tot;
    p.ans = c.res[q.id].ans;
    p.n = (p.n || 0) + 1;
    p.at = new Date().toISOString();
    if (g.correct) p.st = Math.min(TOP, (p.st || 0) + 1); else p.st = 0;
    save();
    render();
  }

  function advance() {
    var c = S.cur;
    c.i++;
    save();
    if (c.i >= c.qids.length) {
      var rec = finishSession();
      go('#/result?id=' + rec.id);
    } else {
      render();
    }
  }

  function startFiltered(list, mode, label) {
    startSession(mode, label, list.map(function (q) { return q.id; }));
  }

  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  var ACTIONS = {
    'more': function () { BF.limit += 20; render(); },
    'reset-filter': function () {
      BF = { subject: '', round: '', type: '', cat1: '', cat2: '', grade: '',
             difficulty: '', status: '', q: '', limit: 20 };
      render();
    },
    'start-filtered': function () {
      var l = filtered();
      startFiltered(l, 'random', '탐색 조건 세트 ' + l.length + '문항');
    },
    'start-round': function () {
      var k = $('#s-subject').value, r = $('#s-round').value;
      var l = QS.filter(function (q) {
        return String(q.round) === String(r) && (!k || q.subject === k);
      }).sort(function (a, b) {
        // 전 과목이면 config 의 과목 순서를 먼저 지키고 그 안에서 문항 번호순
        if (!k && a.subject !== b.subject) {
          return SKEYS.indexOf(a.subject) - SKEYS.indexOf(b.subject);
        }
        return a.no - b.no;
      });
      startFiltered(l, 'round',
        (k ? SUBJ[k].short + ' ' : '') + roundLabel(Number(r)) + ' 모의고사');
    },
    'start-random': function () {
      var k = $('#r-subject').value;
      var pool = QS.filter(function (q) { return !k || q.subject === k; });
      startSession('random', (k ? SUBJ[k].short + ' ' : '') + '랜덤 ' + SF.count + '문항',
        shuffle(pool).slice(0, SF.count).map(function (q) { return q.id; }));
    },
    'start-hotspot': function () {
      var k = $('#h-subject') ? $('#h-subject').value : '';
      var pool = QS.filter(function (q) {
        var t = topicOf(q);
        return t && t.grade === 'A' && (!k || q.subject === k);
      });
      startSession('hotspot', (k ? SUBJ[k].short + ' ' : '') + '빈출 A등급 ' + Math.min(20, pool.length) + '문항',
        shuffle(pool).slice(0, 20).map(function (q) { return q.id; }));
    },
    'start-weak': function () {
      var el = $('#w-subject');
      var k = el ? el.value : '';
      var tops = weakTopics(6, k || null);
      var ids = [];
      tops.forEach(function (w) {
        w.t.ids.forEach(function (id) {
          var p = progOf(id);
          if (!p || p.st < TOP) ids.push(id);
        });
      });
      startSession('weak', (k ? SUBJ[k].short + ' ' : '') + '취약 주제 ' + Math.min(20, ids.length) + '문항',
        shuffle(ids).slice(0, 20));
    },
    'start-wrong': function () {
      startSession('wrong', '오답 다시풀기', shuffle(wrongIds()));
    },
    'start-wrong-filtered': function (btn) {
      var ids = (btn.getAttribute('data-ids') || '').split(',').filter(Boolean);
      startSession('wrong', '오답 다시풀기 ' + ids.length + '문항', ids);
    },
    'review-set': function (btn) {
      var ids = (btn.getAttribute('data-ids') || '').split(',').filter(Boolean);
      startSession('wrong', '틀린 문항 복습 ' + ids.length + '문항', ids);
    },
    'next-choice': function () { advance(); },
    'submit-short': function () {
      var ins = $$('#view [data-blank]');
      var typed = ins.map(function (el) { return el.value; });
      if (!typed.some(function (t) { return t.trim(); })) {
        toast('답을 입력하거나 “모르겠음”을 눌러 주세요');
        if (ins[0]) ins[0].focus();
        return;
      }
      submitShort(typed);
    },
    'mark-unsure': function () {
      // 찍어서 맞힌 경우가 있으니 학습자가 직접 오답 노트로 보낼 길을 남긴다
      var c = S.cur, id = c.qids[c.i], p = prog(id);
      p.vd = 'vague';
      if (c.res[id]) c.res[id].vd = 'vague';
      if (p.st > 0) p.st -= 1;
      save();
      toast('오답 노트에 담았습니다');
      advance();
    },
    'submit': function () {
      var t = $('#ans').value.trim();
      if (!t) { toast('답안을 입력하거나 “모르겠음”을 눌러 주세요'); $('#ans').focus(); return; }
      submitAnswer(t);
    },
    'giveup': function () {
      var cq = S.cur ? QMAP[S.cur.qids[S.cur.i]] : null;
      var m = cq ? modeOf(cq) : MODE;
      if (m === 'choice') pickChoice(-1);
      else if (m === 'short') submitShort((cq.blanks || []).map(function () { return ''; }));
      else submitAnswer('');
    },

    'bookmark': function () {
      var c = S.cur, id = c.qids[c.i], p = prog(id);
      p.bm = !p.bm; save(); render();
      toast(p.bm ? '북마크에 추가했습니다' : '북마크를 해제했습니다');
    },
    'exit-session': function () { go('#/'); },
    'drop-session': function () {
      if (!confirm('진행 중인 세트를 그만둘까요? 이미 판정한 문항의 학습 기록은 남습니다.')) return;
      S.cur = null; save(); render();
    },
    'finish': function () {
      var rec = finishSession();
      go('#/result?id=' + rec.id);
    },
    'cnt-': function () { SF.count = Math.max(5, SF.count - 5); $('#r-count').textContent = SF.count; },
    'cnt+': function () { SF.count = Math.min(60, SF.count + 5); $('#r-count').textContent = SF.count; },
    'export': function () {
      download(TITLE.replace(/[\/:*?"<>|]/g, '') + '_학습기록_' + today() + '.json',
               JSON.stringify(S, null, 1));
      toast('내보내기 파일을 저장했습니다');
    },
    'import': function () { $('#import-file').click(); },
    'reset': function () {
      if (!confirm('학습 기록을 모두 삭제합니다. 되돌릴 수 없습니다. 계속할까요?')) return;
      S = blank(); save(); render();
      toast('학습 기록을 초기화했습니다');
    },
    'theme': function () {
      var root = document.documentElement;
      var dark = root.classList.toggle('dark');
      try { localStorage.setItem('exambank_theme', dark ? 'dark' : 'light'); } catch (e) {}
      toast(dark ? '어두운 화면' : '밝은 화면');
    },
    'drawer-open': function () { $('#drawer').classList.add('on'); },
    'drawer-close': function () { $('#drawer').classList.remove('on'); },
    'frap': function () { go(S.cur ? '#/study' : '#/sets'); }
  };

  document.addEventListener('click', function (e) {
    var pk = e.target.closest('[data-pick]');
    if (pk) { pickChoice(parseInt(pk.getAttribute('data-pick'), 10)); return; }
    var vd = e.target.closest('[data-vd]');
    if (vd) { setVerdict(vd.getAttribute('data-vd')); return; }
    var btn = e.target.closest('[data-act]');
    if (btn && ACTIONS[btn.getAttribute('data-act')]) {
      e.preventDefault();
      ACTIONS[btn.getAttribute('data-act')](btn);
      return;
    }
    var card = e.target.closest('[data-qid]');
    if (card) {
      var id = card.getAttribute('data-qid');
      var q = QMAP[id];
      startSession('single', sname(q.subject) + ' ' + roundLabel(q.round) + ' ' + q.no + '번', [id]);
      return;
    }
    if (e.target.closest('.drawer-scrim') || e.target.closest('.drawer-panel a')) {
      $('#drawer').classList.remove('on');
    }
  });

  document.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'goal-date') {
      S.goal.examDate = e.target.value || null; save(); render();
      toast(S.goal.examDate ? '목표 시험일을 저장했습니다' : '목표 시험일을 지웠습니다');
    } else if (id && id.indexOf('f-') === 0) {
      BF[id.slice(2)] = e.target.value; BF.limit = 20; render();
    } else if (id === 'w-f-subject') { WF.subject = e.target.value; render(); }
    else if (id === 'w-f-kind') { WF.kind = e.target.value; render(); }
    else if (id === 'import-file') {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var o = JSON.parse(fr.result);
          if (!o || typeof o !== 'object' || !o.prog) throw new Error('형식이 올바르지 않습니다');
          if (!confirm('가져온 기록으로 덮어씁니다. 계속할까요?')) return;
          var b = blank();
          for (var k in b) if (!(k in o)) o[k] = b[k];
          S = o; save(); render();
          toast('학습 기록을 가져왔습니다');
        } catch (err) { toast('가져오기 실패: ' + err.message); }
      };
      fr.readAsText(f);
    }
  });

  var searchT;
  document.addEventListener('input', function (e) {
    if (e.target.id === 'f-q') {
      clearTimeout(searchT);
      searchT = setTimeout(function () {
        var v = e.target.value;
        BF.q = v; BF.limit = 20;
        render();
        var el = $('#f-q');
        if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
      }, 260);
    } else if (e.target.id === 'ans') {
      e.target.classList.toggle('valid', e.target.value.trim().length > 0);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') $('#drawer').classList.remove('on');
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && $('#ans')) ACTIONS['submit']();
    if (e.key === 'Enter' && $('#view [data-blank]')) {
      var t = e.target;
      if (t && t.getAttribute && t.getAttribute('data-blank') !== null) {
        e.preventDefault();
        var all = $$('#view [data-blank]');
        var i = all.indexOf(t);
        if (i >= 0 && i < all.length - 1) all[i + 1].focus();
        else ACTIONS['submit-short']();
      }
    }
  });

  window.addEventListener('hashchange', render);

  /* ------------------------------------------------------------- 부트스트랩 */

  function boot() {
    var links = NAV.map(function (n) {
      return '<a data-nav href="' + n[0] + '">' + h(n[1]) + '</a>';
    }).join('');
    var dlinks = NAV.map(function (n) {
      return '<a data-nav href="' + n[0] + '">' + svg(n[2]) + h(n[1]) + '</a>';
    }).join('');

    $('#nav-links').innerHTML = links;
    $('#drawer-links').innerHTML = dlinks;
    render();
  }

  boot();
})();
</script>
</body>
</html>
