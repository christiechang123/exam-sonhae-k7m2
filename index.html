<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="신체손해사정사 2차 기출 기출 학습앱 — 제37~49회 372문항. 오답 노트와 주제별 빈출 분석.">
<!-- 개인 학습앱이라 검색에 걸릴 이유가 없다. 공개 주소에 올려도 색인되지 않게 한다. -->
<meta name="robots" content="noindex, nofollow">
<!-- 아이폰 홈 화면에 추가했을 때: 짧은 이름으로 표시하고, 주소창 없이 앱처럼 연다.
     서비스워커가 아니라 표시 방식만 바꾸는 메타라 오프라인 지원과는 무관하다. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="손해사정사">
<meta name="theme-color" content="#f4f2ee">
<title>신체손해사정사 2차 기출</title>
<script>
/* 본문이 그려지기 전에 테마 클래스를 붙인다. 이게 없으면 다크 모드 사용자가
   열 때마다 흰 화면이 한 번 번쩍인다(FOUC). 단일 HTML 파일이라 여기서 처리한다. */
try {
  var m = localStorage.getItem('exambank_theme');
  if (m === 'dark' || (!m && matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
} catch (e) {}
</script>
<style>/* ==========================================================================
   테마: 웜 그린 (신체손해사정사 2차 앱의 원래 모양)

   따뜻한 크림 캔버스 · 4단계 그린 · 알약 버튼 · 성취 순간의 골드.
   기존 앱을 이 테마로 다시 빌드하면 예전과 같은 모양이 나온다.

       python build_html.py config.json --theme warm

   라이트 단일 테마다. 밝은 크림 ↔ 깊은 그린 밴드의 교대가 이 디자인의 뼈대라
   다크로 뒤집으면 그 리듬이 무너진다. 다크에서도 라이트 값을 유지한다.
   ========================================================================== */

:root,
:root.dark {
  --background: 40 18% 95%;            /* 웜 크림 캔버스 */
  --foreground: 30 8% 14%;
  --card: 40 14% 92%;
  --card-foreground: 30 8% 14%;
  --popover: 0 0% 100%;
  --popover-foreground: 30 8% 14%;
  --primary: 172 45% 27%;              /* 채움 버튼 — Green Accent */
  --primary-foreground: 0 0% 100%;
  --secondary: 40 12% 90%;
  --secondary-foreground: 30 8% 14%;
  --muted: 40 12% 90%;
  --muted-foreground: 30 6% 42%;
  --accent: 168 30% 88%;               /* 성공 틴트 */
  --accent-foreground: 172 45% 22%;
  --destructive: 4 82% 44%;
  --destructive-foreground: 0 0% 100%;
  --border: 40 10% 86%;
  --input: 40 10% 86%;
  --ring: 172 45% 27%;
  --chart-1: 172 45% 27%;
  --chart-2: 168 32% 45%;
  --chart-3: 36 42% 52%;
  --chart-4: 30 8% 14%;
  --chart-5: 40 12% 78%;

  --surface: 0 0% 100%;
  --band: 168 40% 16%;                 /* House Green — 깊은 밴드 */
  --band-foreground: 0 0% 100%;
  --band-muted: 0 0% 100% / 0.7;

  /* 이 테마의 시그니처: 알약 버튼과 성취 순간의 골드 */
  --radius: 0.75rem;
  --radius-sm: 0.5rem;
  --radius-pill: 50px;
  --ceremony: 36 52% 55%;              /* D-day · 점수 · 최상위 빈출 */

  --shadow-card: 0 0 .5px hsl(0 0% 0% / .14), 0 1px 1px hsl(0 0% 0% / .24);
  --shadow-nav: 0 1px 3px hsl(0 0% 0% / .1), 0 2px 2px hsl(0 0% 0% / .06);
  --shadow-float: 0 0 6px hsl(0 0% 0% / .24), 0 8px 12px hsl(0 0% 0% / .14);
  --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
               "Segoe UI", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  --font-display: "Iowan Old Style", "Nanum Myeongjo", Georgia, serif;
  --tracking: -0.01em;
}
</style>
<style>/* ==========================================================================
   기출 학습앱 — 구조 규칙

   색·반경·그림자·서체는 전부 토큰이고 값은 themes/*.css 에 있다.
   여기서는 hsl(var(--x)) 로만 참조한다. 테마를 갈아끼워도 이 파일은 그대로다.

   themes/ 에 없는 토큰을 쓰면 조용히 투명해지므로, 새 토큰이 필요하면
   모든 테마 파일에 함께 추가할 것.
   ========================================================================== */

/* 1rem = 10px. 아래 치수가 전부 이 기준의 rem 값이라 이 줄이 빠지면
   전체가 1.6배로 커지면서 본문이 화면 밖으로 흘러나간다. 건드리지 말 것. */
html { font-size: 62.5%; -webkit-text-size-adjust: 100%; }

* { box-sizing: border-box; }

body {
  margin: 0;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: var(--font-sans);
  font-size: 1.6rem;
  line-height: 1.55;
  letter-spacing: var(--tracking);
  word-break: keep-all;
  overflow-wrap: anywhere;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.25; letter-spacing: var(--tracking); }
p { margin: 0; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
a { color: hsl(var(--foreground)); }
.serif { font-family: var(--font-display); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

:where(button, a, select, input, textarea):focus-visible {
  outline: 2px solid hsl(var(--ring));
  outline-offset: 2px;
}

/* ==========================================================================
   1. 내비게이션
   ========================================================================== */

.nav {
  position: sticky; top: 0; z-index: 40;
  height: 5.8rem;
  background: hsl(var(--surface));
  border-bottom: 1px solid hsl(var(--border));
  box-shadow: var(--shadow-nav);
}
.nav-in {
  height: 100%; max-width: var(--maxw, 96rem); margin: 0 auto;
  padding: 0 var(--gutter); display: flex; align-items: center; gap: 2rem;
}

.wordmark { display: flex; align-items: center; gap: 1rem; text-decoration: none; color: inherit; flex: none; min-height: 4.4rem; }
.wordmark .seal {
  width: 3.4rem; height: 3.4rem; border-radius: var(--radius-sm); flex: none;
  background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
  display: flex; align-items: center; justify-content: center;
  font-size: 1.25rem; font-weight: 700;
}
.wordmark .wm-t { line-height: 1.25; }
.wordmark .wm-t b { display: block; font-size: 1.4rem; font-weight: 700; }
.wordmark .wm-t span { display: block; font-size: 1.1rem; color: hsl(var(--muted-foreground)); letter-spacing: 0; }

.nav-links { display: none; align-items: center; gap: .4rem; flex: 1; }
.nav-links a {
  padding: .8rem 1.2rem; border-radius: var(--radius-sm);
  text-decoration: none; color: hsl(var(--muted-foreground));
  font-size: 1.4rem; font-weight: 600; transition: background .15s, color .15s;
}
.nav-links a:hover { background: hsl(var(--muted)); color: hsl(var(--foreground)); }
.nav-links a.on { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }

.nav-right { margin-left: auto; display: flex; align-items: center; gap: .6rem; }

.icon-btn {
  width: 4.4rem; height: 4.4rem; border: 1px solid transparent; background: transparent;
  cursor: pointer; border-radius: var(--radius-sm); color: hsl(var(--muted-foreground));
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.icon-btn:hover { background: hsl(var(--muted)); color: hsl(var(--foreground)); }
.icon-btn svg { width: 2rem; height: 2rem; }
.icon-btn .moon { display: none; }
:root.dark .icon-btn .moon { display: block; }
:root.dark .icon-btn .sun { display: none; }

@media (min-width: 768px) { .nav-links { display: flex; } .burger { display: none; } }

/* 모바일 드로어 */
.drawer { position: fixed; inset: 0; z-index: 50; visibility: hidden; }
.drawer.on { visibility: visible; }
.drawer-scrim {
  position: absolute; inset: 0; background: hsl(0 0% 0% / .5);
  opacity: 0; transition: opacity .25s ease;
}
.drawer.on .drawer-scrim { opacity: 1; }
.drawer-panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(30rem, 84vw);
  background: hsl(var(--surface)); padding: 1.6rem;
  border-left: 1px solid hsl(var(--border));
  transform: translateX(100%); transition: transform .25s cubic-bezier(.25,.46,.45,.94);
  display: flex; flex-direction: column; gap: .3rem; overflow-y: auto;
}
.drawer.on .drawer-panel { transform: none; }
.drawer-panel a {
  padding: 1.2rem 1.4rem; border-radius: var(--radius-sm); text-decoration: none;
  color: hsl(var(--foreground)); font-size: 1.55rem; font-weight: 600;
  min-height: 4.8rem; display: flex; align-items: center; gap: 1.2rem;
}
.drawer-panel a:hover { background: hsl(var(--muted)); }
.drawer-panel a.on { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.drawer-panel a svg { width: 1.9rem; height: 1.9rem; flex: none; }
.drawer-close { align-self: flex-end; margin-bottom: 1rem; }

/* ==========================================================================
   2. 레이아웃
   ========================================================================== */

:root { --gutter: 1.6rem; --maxw: 96rem; }
@media (min-width: 768px) { :root { --gutter: 2.4rem; } }
@media (min-width: 1024px) { :root { --gutter: 4rem; } }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
main { padding-bottom: 6.4rem; }

.band-plain { padding: 3.2rem 0 2.4rem; }
.band-muted { background: hsl(var(--card)); padding: 3.2rem 0; border-block: 1px solid hsl(var(--border)); }
.band-deep { background: hsl(var(--band)); color: hsl(var(--band-foreground)); padding: 3.2rem 0; }
.band-deep h1, .band-deep h2, .band-deep h3 { color: hsl(var(--band-foreground)); }
.band-deep p, .band-deep .muted, .band-deep .micro, .band-deep .sub { color: hsl(var(--band-muted)); }
.section { padding: 3.2rem 0; }

h1.page-h { font-size: 2.4rem; font-weight: 700; }
h2.sec-h { font-size: 2rem; font-weight: 700; }
.lead { font-size: 1.7rem; line-height: 1.6; color: hsl(var(--muted-foreground)); margin-top: .8rem; }
.sub { font-size: 1.45rem; color: hsl(var(--muted-foreground)); margin-top: .6rem; }
.head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1.6rem; flex-wrap: wrap; margin-bottom: 1.6rem; }

/* ==========================================================================
   3. 버튼
   ========================================================================== */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .8rem;
  padding: 1rem 1.8rem; min-height: 4.4rem;
  border-radius: var(--radius-pill); border: 1px solid transparent;
  font-size: 1.5rem; font-weight: 600; line-height: 1.2;
  text-decoration: none; cursor: pointer; background: transparent;
  color: hsl(var(--foreground)); transition: all .15s ease;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled:active { transform: none; }

.btn-fill { background: hsl(var(--primary)); border-color: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.btn-fill:hover:not(:disabled) { background: hsl(var(--primary) / .88); }
.btn-out { border-color: hsl(var(--border)); background: hsl(var(--surface)); }
.btn-out:hover:not(:disabled) { background: hsl(var(--muted)); }
.btn-ghost { color: hsl(var(--muted-foreground)); }
.btn-ghost:hover:not(:disabled) { background: hsl(var(--muted)); color: hsl(var(--foreground)); }
.btn-danger { border-color: hsl(var(--destructive)); color: hsl(var(--destructive)); }
.btn-danger:hover:not(:disabled) { background: hsl(var(--destructive) / .1); }
/* 다크 밴드 위 */
.btn-inv { background: hsl(var(--band-foreground)); border-color: hsl(var(--band-foreground)); color: hsl(var(--band)); }
.btn-inv:hover:not(:disabled) { background: hsl(var(--band-foreground) / .88); }
.btn-on-deep { border-color: hsl(var(--band-foreground) / .45); color: hsl(var(--band-foreground)); }
.btn-on-deep:hover:not(:disabled) { background: hsl(var(--band-foreground) / .12); }

.btn-sm { padding: .6rem 1.2rem; min-height: 3.6rem; font-size: 1.35rem; }
.btn-block { display: flex; width: 100%; }
.btn-row { display: flex; gap: .8rem; flex-wrap: wrap; }

.frap {
  position: fixed; right: var(--gutter); bottom: var(--gutter); z-index: 45;
  width: 5.2rem; height: 5.2rem; border-radius: 50%;
  background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
  border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-float); transition: all .15s ease;
}
.frap:hover { background: hsl(var(--primary) / .88); }
.frap:active { transform: scale(.95); }
.frap svg { width: 2.4rem; height: 2.4rem; }

/* ==========================================================================
   4. 카드 · 필
   ========================================================================== */

.card {
  background: hsl(var(--surface)); border: 1px solid hsl(var(--border));
  border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 1.6rem;
}
@media (min-width: 768px) { .card { padding: 2.4rem; } }
.card-quiet { background: hsl(var(--card)); box-shadow: none; }
.card-deep { background: hsl(var(--band)); color: hsl(var(--band-foreground)); border-color: transparent; }
.card-deep .card-h { color: hsl(var(--band-foreground)); }
.card-deep .micro, .card-deep .muted { color: hsl(var(--band-muted)); }
.cards { display: grid; gap: 1.2rem; grid-template-columns: 1fr; }
@media (min-width: 600px) { .cards-2 { grid-template-columns: 1fr 1fr; } }

.card-h { font-size: 1.7rem; font-weight: 700; margin-bottom: .8rem; }
.muted { color: hsl(var(--muted-foreground)); font-size: 1.4rem; }
.micro { font-size: 1.3rem; color: hsl(var(--muted-foreground)); line-height: 1.55; }

.pill {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .3rem 1rem; border-radius: 999px;
  font-size: 1.25rem; font-weight: 600; white-space: nowrap;
  border: 1px solid hsl(var(--border)); background: hsl(var(--muted));
  color: hsl(var(--muted-foreground));
}
.pill-solid { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: transparent; }
.pill-out { background: transparent; }
.pill-bad { background: hsl(var(--destructive) / .1); color: hsl(var(--destructive)); border-color: hsl(var(--destructive) / .35); }
.pill-warn { background: hsl(var(--accent) / .2); color: hsl(var(--accent-foreground)); border-color: hsl(var(--accent) / .4); }
.band-deep .pill, .card-deep .pill {
  background: hsl(var(--band-foreground) / .12); color: hsl(var(--band-muted));
  border-color: hsl(var(--band-foreground) / .25);
}
.pills { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }

/* ==========================================================================
   5. 폼
   ========================================================================== */

.field { display: block; margin-bottom: 1.6rem; }
.field > .lbl { display: block; font-size: 1.3rem; font-weight: 700; margin-bottom: .6rem; }
input[type="text"], input[type="date"], input[type="number"], select, textarea {
  width: 100%; padding: 1rem 1.2rem; min-height: 4.4rem;
  background: hsl(var(--surface)); color: hsl(var(--foreground));
  border: 1px solid hsl(var(--input)); border-radius: var(--radius-sm);
  transition: border-color .15s, box-shadow .15s;
}
select { cursor: pointer; }
textarea { min-height: 12rem; resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: hsl(var(--ring)); box-shadow: 0 0 0 3px hsl(var(--ring) / .18);
}
.fieldset { display: grid; gap: .8rem; grid-template-columns: 1fr 1fr; }
@media (min-width: 600px) { .fieldset-3 { grid-template-columns: repeat(3, 1fr); } }
.fieldset .wide { grid-column: 1 / -1; }

.stepper { display: flex; align-items: center; gap: 1.2rem; }
.stepper button {
  width: 3.6rem; height: 3.6rem; border-radius: var(--radius-sm); cursor: pointer;
  border: 1px solid hsl(var(--border)); background: hsl(var(--surface));
  color: hsl(var(--foreground)); font-size: 1.8rem; line-height: 1;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.stepper button:hover { background: hsl(var(--muted)); }
.stepper b { font-size: 1.6rem; font-weight: 700; min-width: 4rem; text-align: center; font-variant-numeric: tabular-nums; }

/* ==========================================================================
   6. 진행 바 · 통계
   ========================================================================== */

.meter { height: 6px; border-radius: 999px; background: hsl(var(--muted)); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: hsl(var(--primary)); transition: width .35s ease; }
.meter > i.bad { background: hsl(var(--destructive)); }
.band-deep .meter { background: hsl(var(--band-foreground) / .18); }
.band-deep .meter > i { background: hsl(var(--band-foreground)); }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; }
.stat {
  background: hsl(var(--surface)); border: 1px solid hsl(var(--border));
  border-radius: var(--radius); padding: 1.4rem 1rem; text-align: center;
}
.stat b { display: block; font-size: 2.2rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { display: block; font-size: 1.2rem; color: hsl(var(--muted-foreground)); margin-top: .2rem; }
.band-deep .stat { background: hsl(var(--band-foreground) / .08); border-color: hsl(var(--band-foreground) / .16); }
.band-deep .stat b { color: hsl(var(--band-foreground)); }
.band-deep .stat span { color: hsl(var(--band-muted)); }

.dday { display: flex; align-items: baseline; gap: 1.2rem; flex-wrap: wrap; }
.dday b { font-size: 4.4rem; font-weight: 700; line-height: 1.05; font-family: var(--font-display); }
.dday .dday-t { font-size: 1.5rem; }

.prog { padding: 1.3rem 0; border-bottom: 1px solid hsl(var(--border)); }
.prog:last-child { border-bottom: 0; padding-bottom: 0; }
.prog:first-child { padding-top: 0; }
.prog .t { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: .7rem; }
.prog .t b { font-size: 1.5rem; font-weight: 600; }
.prog .t span { font-size: 1.3rem; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }

.heat { display: flex; flex-direction: column; }
.heatrow {
  display: flex; align-items: center; gap: 1.2rem; padding: .9rem 0;
  border-bottom: 1px solid hsl(var(--border)); font-size: 1.4rem;
}
.heatrow:last-child { border-bottom: 0; }
.heatrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heatrow .meter { width: 8rem; flex: none; }
.heatrow .pc { width: 4.6rem; text-align: right; flex: none; font-weight: 700; font-variant-numeric: tabular-nums; color: hsl(var(--muted-foreground)); }
.band-deep .heatrow { border-bottom-color: hsl(var(--band-foreground) / .16); }

.kv { display: flex; justify-content: space-between; gap: 1.6rem; padding: 1rem 0; border-bottom: 1px solid hsl(var(--border)); font-size: 1.4rem; }
.kv:last-child { border-bottom: 0; }
.kv b { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

/* ==========================================================================
   7. 문항 카드 · 목록
   ========================================================================== */

.qlist { display: grid; gap: .8rem; }
.qcard {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: hsl(var(--surface)); border: 1px solid hsl(var(--border));
  border-radius: var(--radius); box-shadow: var(--shadow-card);
  padding: 1.6rem; transition: border-color .15s, box-shadow .15s;
}
.qcard:hover { border-color: hsl(var(--ring) / .55); }
.qcard .qtop { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
.qcard .qsum { font-size: 1.55rem; font-weight: 600; line-height: 1.5; }
.qcard .qkw { margin-top: .8rem; font-size: 1.3rem; color: hsl(var(--muted-foreground)); }
.count-line { font-size: 1.3rem; color: hsl(var(--muted-foreground)); font-weight: 600; margin: 1.6rem 0 .8rem; }

/* ==========================================================================
   8. 풀이 화면
   ========================================================================== */

.study-bar { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.6rem; }
.study-bar .meter { flex: 1; }
.study-bar .pos { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

.qhead { padding: 2.4rem 0 2rem; }
.qtext { font-size: 1.9rem; font-weight: 600; line-height: 1.6; margin-top: 1.2rem; }
@media (min-width: 768px) { .qtext { font-size: 2.1rem; } }

/* 객관식 선택지 */
.choices { display: flex; flex-direction: column; gap: .8rem; }
.choice {
  display: flex; align-items: flex-start; gap: 1.2rem; width: 100%; text-align: left;
  padding: 1.4rem 1.6rem; min-height: 5rem; cursor: pointer;
  background: hsl(var(--surface)); border: 1px solid hsl(var(--border));
  border-radius: var(--radius); font-size: 1.5rem; line-height: 1.55;
  color: hsl(var(--foreground)); transition: all .15s;
}
button.choice:hover { border-color: hsl(var(--ring)); background: hsl(var(--muted)); }
button.choice:active { transform: scale(.995); }
.choice.done { cursor: default; }
.choice .cn {
  flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: hsl(var(--muted)); color: hsl(var(--muted-foreground));
  font-size: 1.25rem; font-weight: 700; margin-top: .1rem;
}
.choice .ct { flex: 1; min-width: 0; }
.choice.is-answer { border-color: hsl(var(--primary)); background: hsl(var(--primary) / .07); }
.choice.is-answer .cn { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.choice.is-wrong { border-color: hsl(var(--destructive)); background: hsl(var(--destructive) / .07); }
.choice.is-wrong .cn { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }

/* 단답형 빈칸 */
.blanks { display: flex; flex-direction: column; gap: 1.2rem; }
.blank { display: flex; align-items: center; gap: 1.2rem; }
.blank .blabel {
  flex: none; min-width: 3.2rem; height: 3.2rem; padding: 0 .8rem;
  border-radius: var(--radius-sm); background: hsl(var(--muted));
  color: hsl(var(--muted-foreground)); font-weight: 700; font-size: 1.4rem;
  display: flex; align-items: center; justify-content: center;
}
.blank input { flex: 1; }
.blank input.ok { border-color: hsl(var(--primary)); box-shadow: 0 0 0 3px hsl(var(--primary) / .14); }
.blank input.no { border-color: hsl(var(--destructive)); box-shadow: 0 0 0 3px hsl(var(--destructive) / .14); }
.blank .mark { flex: none; width: 2.4rem; text-align: center; font-size: 1.6rem; font-weight: 700; }
.blank .mark.ok { color: hsl(var(--primary)); }
.blank .mark.no { color: hsl(var(--destructive)); }

.ans-reveal { display: flex; flex-direction: column; gap: .8rem; }
.ans-row { display: flex; align-items: baseline; gap: 1rem; font-size: 1.5rem; }
.ans-row .blabel { min-width: 3.2rem; height: auto; padding: .2rem .8rem; }
.ans-row b { font-weight: 700; }
.ans-row .acc { color: hsl(var(--muted-foreground)); font-size: 1.35rem; }

.recall { background: hsl(var(--card)); border-radius: var(--radius); padding: 1.6rem; border: 1px solid hsl(var(--border)); }
.recall .rl { font-size: 1.25rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: hsl(var(--muted-foreground)); margin-bottom: .8rem; }
.expl { font-size: 1.5rem; line-height: 1.75; white-space: pre-wrap; }
.answer-echo { background: hsl(var(--muted)); border-radius: var(--radius-sm); padding: 1.2rem 1.4rem; font-size: 1.4rem; white-space: pre-wrap; color: hsl(var(--muted-foreground)); }

.verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; }
.verdicts button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem;
  min-height: 6.8rem; padding: 1.2rem .6rem; cursor: pointer;
  border: 1px solid hsl(var(--border)); border-radius: var(--radius);
  background: hsl(var(--surface)); font-size: 1.45rem; font-weight: 700; transition: all .15s;
}
.verdicts button small { font-size: 1.15rem; font-weight: 400; color: hsl(var(--muted-foreground)); }
.verdicts button:active { transform: scale(.98); }
.verdicts .v-ok:hover { border-color: hsl(var(--primary)); background: hsl(var(--primary) / .07); }
.verdicts .v-vague:hover { border-color: hsl(var(--accent)); background: hsl(var(--accent) / .18); }
.verdicts .v-no:hover { border-color: hsl(var(--destructive)); background: hsl(var(--destructive) / .07); }

/* ==========================================================================
   9. 결과 · 합격 판정
   ========================================================================== */

.score { text-align: center; padding: 1.6rem 0; }
.score b { display: block; font-size: 5.6rem; font-weight: 700; line-height: 1.05; font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.score .sl { font-size: 1.5rem; }

/* 합격 = primary 채움(가장 강한 대비) / 불합격 = destructive 테두리.
   빨강 채움은 학습 화면에서 과해서 쓰지 않는다. */
.verdict-badge {
  display: inline-flex; align-items: center; gap: .8rem;
  padding: .8rem 2rem; border-radius: 999px;
  font-size: 1.6rem; font-weight: 700; border: 2px solid transparent;
}
.verdict-badge.pass { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.verdict-badge.fail { border-color: hsl(var(--destructive)); color: hsl(var(--destructive)); background: hsl(var(--destructive) / .08); }
.band-deep .verdict-badge.pass { background: hsl(var(--band-foreground)); color: hsl(var(--band)); }
.band-deep .verdict-badge.fail { border-color: hsl(var(--destructive)); color: hsl(var(--destructive)); background: hsl(var(--destructive) / .16); }

/* 과목별 득점 — 과락 행은 좌측 바로 먼저 눈에 띄게 */
.subj-score {
  display: grid; grid-template-columns: auto 1fr auto; gap: .4rem 1.2rem;
  align-items: center; padding: 1.2rem 0 1.2rem 1.2rem;
  border-bottom: 1px solid hsl(var(--border)); border-left: 3px solid transparent;
}
.subj-score:last-child { border-bottom: 0; }
.subj-score.cut { border-left-color: hsl(var(--destructive)); }
.subj-score.cut .sname, .subj-score.cut .spts { color: hsl(var(--destructive)); }
.subj-score .sname { font-size: 1.45rem; font-weight: 600; }
.subj-score .spts { font-size: 1.4rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.subj-score .sbar { grid-column: 1 / -1; }
.subj-score .snote { grid-column: 1 / -1; font-size: 1.2rem; color: hsl(var(--muted-foreground)); }
.subj-score.cut .snote { color: hsl(var(--destructive)); font-weight: 600; }
.band-deep .subj-score { border-bottom-color: hsl(var(--band-foreground) / .16); }

.rrow { display: flex; align-items: center; gap: 1.2rem; padding: 1.1rem 0; border-bottom: 1px solid hsl(var(--border)); }
.rrow:last-child { border-bottom: 0; }
.rrow .n { width: 3.4rem; flex: none; font-size: 1.3rem; font-weight: 700; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }
.rrow .rt { flex: 1; min-width: 0; }
.rrow .rt b { display: block; font-size: 1.4rem; font-weight: 600; line-height: 1.5; }
.rrow .rt small { font-size: 1.2rem; color: hsl(var(--muted-foreground)); }

/* ==========================================================================
   10. 기타
   ========================================================================== */

.empty { text-align: center; padding: 4.8rem 1.6rem; }
.empty .ei { width: 5.2rem; height: 5.2rem; margin: 0 auto 1.6rem; border-radius: var(--radius); background: hsl(var(--muted)); color: hsl(var(--muted-foreground)); display: flex; align-items: center; justify-content: center; }
.empty h3 { font-size: 1.8rem; font-weight: 700; margin-bottom: .8rem; }
.empty p { font-size: 1.45rem; color: hsl(var(--muted-foreground)); margin-bottom: 1.6rem; }

.chart { width: 100%; height: auto; display: block; overflow: visible; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.expander { border-bottom: 1px solid hsl(var(--border)); }
.expander:last-child { border-bottom: 0; }
.expander > summary {
  cursor: pointer; list-style: none; padding: 1.4rem 0; min-height: 4.4rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1.2rem;
  font-size: 1.5rem; font-weight: 600;
}
.expander > summary::-webkit-details-marker { display: none; }
.expander > summary::after { content: "+"; color: hsl(var(--muted-foreground)); font-weight: 400; flex: none; font-size: 1.8rem; }
.expander[open] > summary::after { content: "\2212"; }
.expander > .exp-body { padding-bottom: 1.6rem; }

.footer {
  background: hsl(var(--card)); color: hsl(var(--muted-foreground));
  border-top: 1px solid hsl(var(--border)); padding: 4rem 0 4.8rem; margin-top: 4.8rem;
}
.footer h4 { color: hsl(var(--foreground)); font-size: 1.4rem; font-weight: 700; margin-bottom: 1rem; }
.footer p { font-size: 1.3rem; line-height: 1.7; }
.footer .fgrid { display: grid; gap: 2.4rem; grid-template-columns: 1fr; }
@media (min-width: 600px) { .footer .fgrid { grid-template-columns: 1fr 1fr; } }

.toast {
  position: fixed; left: 50%; bottom: 6.4rem; transform: translateX(-50%) translateY(1rem);
  z-index: 60; background: hsl(var(--foreground)); color: hsl(var(--background));
  padding: 1.1rem 2rem; border-radius: var(--radius); font-size: 1.4rem; font-weight: 600;
  box-shadow: var(--shadow-float); opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 모바일 터치 타깃 — 작은 버튼은 시각 크기를 유지한 채 탭 영역만 넓힌다 */

  .stepper button { position: relative; }
  .stepper button::after { content: ""; position: absolute; inset: -.4rem; border-radius: var(--radius-sm); }
}

@media print { .nav, .frap, .drawer, .toast, .footer { display: none !important; } }
